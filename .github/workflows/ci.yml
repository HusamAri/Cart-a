# Free CI: static checks only (no paid services).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke static + deploy file check
        run: npm run check
      - name: Production drift (optional, non-blocking)
        run: npm run check:prod
        continue-on-error: true
