<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/scripts/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Menu · Carta</title>
<meta name="theme-color" content="#1B2A22">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/carta-favicon.png?v=7">
<link rel="stylesheet" href="/styles/tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--surface);
    color: var(--on-surface);
  }
  .guest-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--sp-6) var(--margin-mobile) var(--sp-10);
  }
  .guest-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    margin-bottom: var(--sp-6);
  }
  @media (max-width: 520px) {
    .guest-top { flex-direction: column; align-items: stretch; }
    .guest-top__actions { justify-content: space-between; width: 100%; }
  }
  .guest-top img.carta-lockup {
    height: clamp(40px, 5vw, 48px);
    width: auto;
    display: block;
  }
  .guest-top img.ws-logo {
    max-height: 44px;
    max-width: 140px;
    width: auto;
    object-fit: contain;
  }
  .guest-status {
    text-align: center;
    padding: var(--sp-8);
    color: var(--on-surface-variant);
  }
  .guest-status.error { color: var(--error, #b3261e); }
  .menu-print {
    --menu-accent: #1b2a22;
    --menu-paper-bg: linear-gradient(165deg, #fdfcfa 0%, #f8f5ef 48%, #eef3eb 100%);
    --menu-paper-text: #1b2a22;
    --menu-paper-text-muted: #4a5c54;
    --menu-paper-rule: rgb(27 42 34 / 0.2);
    color: var(--menu-paper-text);
    background: var(--menu-paper-bg);
    border: 1px solid rgb(27 42 34 / 0.12);
    border-radius: var(--r-2xl);
    box-shadow: var(--shadow-3);
    padding: clamp(var(--sp-6), 4vw, var(--sp-9)) clamp(var(--sp-5), 3vw, var(--sp-8));
    position: relative;
    overflow: hidden;
  }
  .menu-print--navy { --menu-accent: #1b2a22; }
  .menu-print--sage { --menu-accent: #2d4a3e; }
  .menu-print--gold { --menu-accent: #9a7b1a; }
  .menu-print--wine { --menu-accent: #6b2d3c; }
  .menu-print--forest { --menu-accent: #2d4a3e; }
  .menu-print__head {
    display: flex;
    align-items: flex-start;
    gap: var(--sp-4);
    padding-bottom: var(--sp-5);
    margin-bottom: var(--sp-5);
    border-bottom: 2px solid var(--menu-accent);
  }
  .menu-print__title {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.75rem, 4vw, 2.35rem);
    line-height: 1.1;
    color: var(--menu-paper-text);
    margin: 0 0 6px;
  }
  .menu-print__meta {
    margin: 0;
    font-size: var(--type-caption);
    color: var(--menu-paper-text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .menu-print__section { margin-bottom: var(--sp-6); }
  .menu-print__section-title {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--menu-accent);
    margin: 0 0 var(--sp-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 10px 0 8px;
    background: var(--menu-paper-bg);
    box-shadow: 0 1px 0 var(--menu-paper-rule);
  }
  .menu-print__price {
    font-weight: 600;
    font-size: 15px;
    color: var(--menu-accent);
    white-space: nowrap;
  }
  .guest-loading {
    padding: var(--sp-8) 0;
  }
  .guest-loading__card {
    border-radius: var(--r-2xl);
    border: 1px solid var(--outline-variant);
    background: var(--surface-container-low);
    padding: var(--sp-6);
    animation: guest-pulse 1.2s ease-in-out infinite;
  }
  .guest-loading__line {
    height: 12px;
    border-radius: var(--r-pill);
    background: rgb(var(--ink-rgb) / 0.08);
    margin-bottom: 12px;
  }
  .guest-loading__line--short { width: 55%; }
  @keyframes guest-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }
  @media (prefers-reduced-motion: reduce) {
    .guest-loading__card { animation: none; }
  }
  .menu-print__list { list-style: none; margin: 0; padding: 0; }
  .menu-print__item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, max-content);
    gap: 8px;
    align-items: baseline;
    padding: 7px 0;
    font-size: 16px;
    line-height: 1.45;
  }
  .menu-print__dish { font-weight: 500; }
  .menu-print__dots {
    border-bottom: 1px dotted var(--menu-paper-rule);
    min-width: 24px;
    margin-bottom: 4px;
  }
  .menu-print__kcal {
    font-size: 11px;
    color: var(--menu-paper-text-muted);
    white-space: nowrap;
  }
  .menu-print .chip-mist { background: #e8efe6; color: #2d4538; font-size: 9px; padding: 2px 6px; border-radius: 999px; }
  .menu-print .chip-gold { background: #f3ebce; color: #5c4f20; font-size: 9px; padding: 2px 6px; border-radius: 999px; }
  .guest-foot {
    margin-top: var(--sp-6);
    text-align: center;
    font-size: 11px;
    color: var(--on-surface-variant);
  }
  .guest-foot a { color: var(--primary); }
  .guest-top__actions {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    flex-shrink: 0;
  }
  .guest-print-btn {
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    min-height: 44px;
    min-width: 44px;
    padding: 8px 14px;
    border-radius: var(--r-pill);
    border: 1px solid var(--outline-variant);
    background: var(--surface-container-low);
    color: var(--primary);
    cursor: pointer;
  }
  .guest-print-btn:hover { background: var(--surface-container); }
  .guest-print-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .guest-top .lang-toggle button {
    min-width: 44px;
    min-height: 44px;
  }
  .guest-section-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 var(--sp-5);
    padding: 0;
    list-style: none;
  }
  .guest-section-nav a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--menu-accent, #1b2a22);
    border: 1px solid rgb(27 42 34 / 0.18);
    border-radius: var(--r-pill);
    background: rgb(255 255 255 / 0.65);
  }
  .guest-section-nav a:focus-visible { outline: 2px solid var(--menu-accent, #1b2a22); outline-offset: 2px; }
  .guest-allergen-note {
    margin: var(--sp-5) 0 0;
    padding: var(--sp-4);
    font-size: 12px;
    line-height: 1.5;
    color: var(--menu-paper-text-muted);
    border-radius: var(--r-lg);
    background: rgb(27 42 34 / 0.04);
    border: 1px solid rgb(27 42 34 / 0.1);
  }
  @media print {
    .guest-top__actions .lang-toggle,
    .guest-print-btn,
    .guest-foot { display: none !important; }
    .guest-wrap { max-width: none; padding: 0; }
    body { background: #fff; }
  }
  .menu-print .chip-allergen {
    background: rgb(107 45 60 / 0.12);
    color: #6b2d3c;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .menu-print .chip-diet {
    background: rgb(45 74 62 / 0.12);
    color: #2d4a3e;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .menu-print__tail {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: flex-end;
    align-items: center;
  }
</style>
</head>
<body>
<main id="main" class="guest-wrap">
  <p class="guest-status" id="status" role="status" aria-live="polite" data-i18n="guest.loading">Loading menu…</p>
</main>

<script type="module">
import { supabase } from '/src/supabase-client.js';
import { fetchGuestMenu } from '/src/menu-guest.js';
import { applyTranslations, t, setLang, getLang, wireLangSwitchers } from '/src/i18n.js';
import { computeRecipe, formatMoney } from '/src/recipe-compute.js';
import { ALLERGEN_LABELS } from '/src/nutrient-db.js';
import {
  menuSectionI18nKey,
  sectionsForMenuDisplay,
  normalizeMenuType,
} from '/src/menu-structure.js';
import { menuTypeBadgeHtml } from '/src/menu-type-icon.js';
import { menuClusterIconHtml, normalizeMenuClusterIcon } from '/src/menu-cluster-icon.js';

const params = new URLSearchParams(window.location.search);
const token = params.get('t') || params.get('token') || '';
let lastGuestPayload = null;

const langParam = (params.get('lang') || '').toLowerCase();
if (['en', 'tr', 'es'].includes(langParam)) setLang(langParam);

window.addEventListener('carta-lang-change', () => {
  if (lastGuestPayload) {
    renderMenu(document.getElementById('main'), lastGuestPayload);
  }
});

function escapeHTML(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function kindLabel(kind) {
  return kind === 'drink' ? t('recipes.kind_drink') : t('recipes.kind_food');
}

function sectionLabel(sectionKey) {
  const k = menuSectionI18nKey(sectionKey);
  const label = t(k);
  return label !== k ? label : sectionKey;
}

function dishMetaChips(comp) {
  const cl = getLang();
  const parts = [];
  for (const a of (comp.allergens || []).slice(0, 3)) {
    const lab = ALLERGEN_LABELS[a]?.[cl] || a;
    parts.push(`<span class="chip chip-allergen">${escapeHTML(lab)}</span>`);
  }
  for (const d of (comp.dietTags || []).slice(0, 2)) {
    parts.push(`<span class="chip chip-diet">${escapeHTML(t('diet.' + d) || d)}</span>`);
  }
  return parts.join('');
}

function showLoading(host) {
  host.innerHTML = `
    <div class="guest-loading" aria-busy="true" aria-live="polite">
      <p class="guest-status" data-i18n="guest.loading">Loading menu…</p>
      <div class="guest-loading__card" aria-hidden="true">
        <div class="guest-loading__line"></div>
        <div class="guest-loading__line guest-loading__line--short"></div>
        <div class="guest-loading__line"></div>
        <div class="guest-loading__line"></div>
      </div>
    </div>`;
  applyTranslations();
}

async function boot() {
  const host = document.getElementById('main');
  if (!token || token.length < 16) {
    const status = document.createElement('p');
    status.className = 'guest-status error';
    status.setAttribute('role', 'status');
    host.innerHTML = '';
    host.appendChild(status);
    status.textContent = t('guest.invalid_link');
    applyTranslations();
    return;
  }

  showLoading(host);

  try {
    const payload = await fetchGuestMenu(supabase, token);
    if (!payload || payload.error) {
      host.innerHTML = `<p class="guest-status error" role="status">${escapeHTML(t('guest.not_found'))}</p>`;
      applyTranslations();
      return;
    }
    lastGuestPayload = payload;
    renderMenu(host, payload);
    applyTranslations();
    document.title = `${payload.menu?.name || 'Menu'} · Carta`;
  } catch (err) {
    console.error(err);
    host.innerHTML = `<p class="guest-status error" role="status">${escapeHTML(t('guest.load_error'))}</p>`;
    applyTranslations();
  }
}

function renderMenu(host, payload) {
  const menu = payload.menu || {};
  const ws = payload.workspace || {};
  const rawSections = Array.isArray(payload.sections) ? payload.sections : [];
  const dishes = Array.isArray(payload.dishes) ? payload.dishes : [];
  const dm = new Map(dishes.map((d) => [d.id, d]));
  const color = menu.color || 'navy';
  const icon = normalizeMenuClusterIcon(menu.icon);
  const menuType = normalizeMenuType(menu.type);
  const currency = ws.currency || '₺';
  const sections = sectionsForMenuDisplay(
    { type: menuType, dishes: { v: 2, sections: rawSections } },
    rawSections,
  ).filter((sec) => (sec.dish_ids || []).length > 0);

  let hasAllergens = false;
  const renderedSections = sections
    .map((sec, idx) => {
      const items = (sec.dish_ids || []).map((id) => {
        const d = dm.get(id);
        if (!d) return '';
        const data = d.data || {};
        const comp = computeRecipe({ ingredients: data.ingredients || [], servings: data.servings || 1 });
        if ((comp.allergens || []).length) hasAllergens = true;
        const kcal = Math.round(comp.perServing?.kcal || 0);
        const meta = dishMetaChips(comp);
        const price = Number(data.menu_price);
        const priceHtml = price > 0
          ? `<span class="menu-print__price">${escapeHTML(formatMoney(price, currency, 0))}</span>`
          : '';
        return `<li class="menu-print__item">
          <span class="menu-print__dish">${escapeHTML(d.name)}</span>
          <span class="menu-print__dots" aria-hidden="true"></span>
          <span class="menu-print__tail">
            ${priceHtml}
            ${meta}
            <span class="chip ${d.kind === 'drink' ? 'chip-gold' : 'chip-mist'}">${escapeHTML(kindLabel(d.kind))}</span>
            ${kcal ? `<span class="menu-print__kcal">${kcal} kcal</span>` : ''}
          </span>
        </li>`;
      }).filter(Boolean).join('');
      if (!items) return null;
      const secKey = sec.key || 'other';
      const secId = `sec-${secKey}-${idx}`;
      return {
        secId,
        label: sectionLabel(secKey),
        html: `<section class="menu-print__section" id="${escapeHTML(secId)}" aria-labelledby="${escapeHTML(secId)}-title">
        <h2 class="menu-print__section-title" id="${escapeHTML(secId)}-title">${escapeHTML(sectionLabel(secKey))}</h2>
        <ul class="menu-print__list">${items}</ul>
      </section>`,
      };
    }).filter(Boolean);

  const sectionHtml = renderedSections.map((section) => section.html).join('');

  const sectionNav = renderedSections.length >= 3
    ? `<nav class="guest-section-nav-wrap" aria-label="${escapeHTML(t('guest.section_nav'))}">
        <ul class="guest-section-nav">
          ${renderedSections.map((section) => {
      return `<li><a href="#${escapeHTML(section.secId)}">${escapeHTML(section.label)}</a></li>`;
    }).join('')}
        </ul>
      </nav>`
    : '';

  const allergenNote = hasAllergens
    ? `<p class="guest-allergen-note" data-i18n="guest.allergen_note">${escapeHTML(t('guest.allergen_note'))}</p>`
    : '';

  host.innerHTML = `
    <header class="guest-top">
      <img class="carta-lockup" src="/assets/carta-brand-lockup-horizontal.png?v=7" alt="Carta" width="876" height="294" decoding="async">
      <div class="guest-top__actions">
        <button type="button" class="guest-print-btn" id="guestPrintBtn" data-i18n="guest.print">Print menu</button>
        <div class="lang-toggle lang-toggle--compact" role="group" aria-label="${escapeHTML(t('ui.lang.group_aria'))}">
          <button type="button" data-lang-btn="en">EN</button>
          <button type="button" data-lang-btn="tr">TR</button>
          <button type="button" data-lang-btn="es">ES</button>
        </div>
        ${ws.logo_url ? `<img class="ws-logo" src="${escapeHTML(ws.logo_url)}" alt="${escapeHTML(ws.name || '')}" decoding="async">` : ''}
      </div>
    </header>
    <article class="menu-print menu-print--${escapeHTML(color)}">
      <header class="menu-print__head">
        <span class="menu-print__mark">${menuClusterIconHtml(icon, { size: 28 })}</span>
        <div>
          <h1 class="menu-print__title">${escapeHTML(menu.name || t('guest.menu_fallback'))}</h1>
          <p class="menu-print__meta menu-print__meta-row" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0">
            ${menuTypeBadgeHtml(menuType, t('menus.type.' + menuType), { size: 12 })}
            ${ws.name ? `<span>${escapeHTML(ws.name)}</span>` : ''}
          </p>
        </div>
      </header>
      ${sectionNav}
      ${sectionHtml || `<p class="guest-status">${escapeHTML(t('guest.empty_menu'))}</p>`}
      ${allergenNote}
    </article>
    <p class="guest-foot">${escapeHTML(t('guest.powered'))} <a href="https://cart-a.live/">Carta</a></p>
  `;
  wireLangSwitchers(host);
  host.querySelector('#guestPrintBtn')?.addEventListener('click', () => window.print());
}

applyTranslations();
boot();
</script>
</body>
</html>
