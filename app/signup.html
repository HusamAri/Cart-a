<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/scripts/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Begin · Carta</title>
<meta name="description" content="Create your Carta workspace: one email and a secure link to start.">
<meta name="theme-color" content="#1B2A22">
<meta property="og:title" content="Begin · Carta">
<meta property="og:description" content="Create your Carta workspace: one email and a secure link to start.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en">
<meta property="og:site_name" content="Carta">
<meta property="og:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Carta · F&amp;B Operations Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">

<link rel="icon" type="image/png" href="/assets/carta-favicon.png?v=7">
<link rel="apple-touch-icon" href="/assets/carta-apple-touch-icon.png?v=7">
<link rel="stylesheet" href="/styles/tokens.css">
</head>
<body class="auth-screen">
<div class="auth-chrome-bar" style="position:fixed;top:16px;right:16px;z-index:70">
  <button type="button" class="carta-theme-btn" id="authThemeBtn" aria-label="">◐</button>
</div>

<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<main id="main">
<form class="auth-card" id="signupForm" novalidate aria-labelledby="signup-h">
  <a href="/" class="site-logo" aria-label="Carta home"><img src="/assets/carta-brand-lockup-horizontal.png?v=7" alt="Carta · F&amp;B Operations Studio" width="1024" height="1024"></a>

  <span class="eyebrow eyebrow-accent" id="signupEyebrow" data-i18n="signup.eyebrow">Begin · Workspace</span>
  <h1 class="h1" id="signup-h" style="margin-top:var(--sp-3)"><em data-i18n="auth.signup_title">Begin a workspace.</em></h1>
  <p class="lead" style="margin-top:var(--sp-4)" id="signupIntro" data-i18n="auth.signup_intro">One email. A magic link. Your kitchen's operations studio in thirty seconds.</p>

  <div style="margin-top:var(--sp-7)">
    <label class="label" for="email" data-i18n="auth.label_email">Work email</label>
    <input type="email" id="email" name="email" class="input" placeholder="you@hotel.com" required autocomplete="email">
  </div>

  <div id="passwordFields" hidden>
    <div style="margin-top:var(--sp-5)">
      <label class="label" for="password" data-i18n="auth.label_password">Password</label>
      <input type="password" id="password" name="password" class="input" placeholder="••••••••" minlength="6" autocomplete="new-password">
      <p class="caption" style="margin:var(--sp-2) 0 0" data-i18n="auth.password_hint">At least 6 characters.</p>
    </div>
    <div style="margin-top:var(--sp-5)">
      <label class="label" for="passwordConfirm" data-i18n="auth.label_password_confirm">Confirm password</label>
      <input type="password" id="passwordConfirm" name="passwordConfirm" class="input" placeholder="••••••••" minlength="6" autocomplete="new-password">
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="margin-top:var(--sp-7)">
    <span id="submitLabel" data-i18n="auth.send_link">Send magic link</span>
    <span class="arrow">→</span>
  </button>

  <div id="flash" role="status" aria-live="polite"></div>

  <div class="thin-rule" style="margin:var(--sp-7) 0 var(--sp-5)"></div>

  <p style="font-size:var(--type-caption);color:var(--on-surface-variant);margin:0">
    <span data-i18n="auth.have_account">Already have an account?</span>
    <a href="/app/login.html" id="authSigninLink" style="color:var(--primary);font-weight:600;margin-left:6px" data-i18n="auth.signin_link">Sign in →</a>
  </p>
</form>
</main>

<script type="module">
import { sendMagicLink, signUpWithPassword } from '/src/auth.js';
import { getSessionAfterUrlAuth } from '/src/supabase-client.js';
import { storeInviteToken, readStoredInviteToken, storeSignupPlan, normalizeSignupPlan, readStoredSignupPlan } from '/src/workspaces.js';
import { applyTranslations, t } from '/src/i18n.js';
import { initTheme, cycleThemePref, getThemePref, themePrefGlyph } from '/src/theme.js';
applyTranslations();
initTheme();
function syncAuthThemeBtn() {
  const btn = document.getElementById('authThemeBtn');
  if (!btn) return;
  const pref = getThemePref();
  btn.textContent = themePrefGlyph(pref);
  const label = pref === 'system' ? t('ui.theme.aria_system') : pref === 'light' ? t('ui.theme.aria_light') : t('ui.theme.aria_dark');
  btn.setAttribute('aria-label', label);
  btn.title = label;
}
syncAuthThemeBtn();
document.getElementById('authThemeBtn')?.addEventListener('click', () => {
  cycleThemePref();
  syncAuthThemeBtn();
});
window.addEventListener('carta-theme-change', syncAuthThemeBtn);

const params = new URLSearchParams(window.location.search);
const inviteToken = (params.get('invite') || '').trim();
const prefillEmail = (params.get('email') || '').trim();
const signupPlan = normalizeSignupPlan(params.get('plan') || '') || readStoredSignupPlan();
if (inviteToken) storeInviteToken(inviteToken);
if (signupPlan) storeSignupPlan(signupPlan);

const form = document.getElementById('signupForm');
const submitBtn = document.getElementById('submitBtn');
const submitLabel = document.getElementById('submitLabel');
const flash = document.getElementById('flash');

const isPasswordSignup = signupPlan === 'pro';
const passwordFields = document.getElementById('passwordFields');
const signupEyebrow = document.getElementById('signupEyebrow');
const signupIntro = document.getElementById('signupIntro');
const passwordInput = document.getElementById('password');
const passwordConfirmInput = document.getElementById('passwordConfirm');

if (isPasswordSignup) {
  passwordFields.hidden = false;
  passwordInput.required = true;
  passwordConfirmInput.required = true;
  signupEyebrow.dataset.i18n = 'auth.signup_pro_eyebrow';
  signupEyebrow.textContent = t('auth.signup_pro_eyebrow');
  signupIntro.dataset.i18n = 'auth.signup_pro_intro';
  signupIntro.textContent = t('auth.signup_pro_intro');
  submitLabel.dataset.i18n = 'auth.create_account_btn';
  submitLabel.textContent = t('auth.create_account_btn');
}

(() => {
  const token = inviteToken || readStoredInviteToken() || '';
  const qp = new URLSearchParams();
  if (token) qp.set('invite', token);
  if (prefillEmail) qp.set('email', prefillEmail);
  if (signupPlan) qp.set('plan', signupPlan);
  const q = qp.toString();
  const el = document.getElementById('authSigninLink');
  if (el) el.href = '/app/login.html' + (q ? `?${q}` : '');
})();

(async () => {
  const session = await getSessionAfterUrlAuth();
  if (!session) return;
  const token = inviteToken || readStoredInviteToken() || '';
  window.location.replace(token ? `/app/?invite=${encodeURIComponent(token)}` : '/app/');
})();

if (prefillEmail) document.getElementById('email').value = prefillEmail;
if (inviteToken) {
  flash.innerHTML = `<div class="flash success">${escapeHTML(t('ws.invite_link_opened') || 'Invitation detected. Create your profile to continue.')}</div>`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  submitBtn.disabled = true;
  submitLabel.innerHTML = '<span class="spinner"></span> ' + t('auth.sending');
  flash.innerHTML = '';

  let result;
  if (isPasswordSignup) {
    const password = passwordInput.value;
    const passwordConfirm = passwordConfirmInput.value;
    if (password !== passwordConfirm) {
      submitBtn.disabled = false;
      submitLabel.textContent = t('auth.create_account_btn');
      flash.innerHTML = `<div class="flash error">${escapeHTML(t('auth.password_mismatch'))}</div>`;
      return;
    }
    result = await signUpWithPassword(email, password);
  } else {
    const tokenForRedirect = inviteToken || readStoredInviteToken() || '';
    result = await sendMagicLink(email, { allowSignup: true, inviteToken: tokenForRedirect });
  }

  submitBtn.disabled = false;
  submitLabel.textContent = isPasswordSignup ? t('auth.create_account_btn') : t('auth.send_link');

  if (result.ok) {
    if (isPasswordSignup) {
      if (result.session) {
        const token = inviteToken || readStoredInviteToken() || '';
        window.location.replace(token ? `/app/?invite=${encodeURIComponent(token)}` : '/app/');
        return;
      }
      flash.innerHTML = `<div class="flash success">${escapeHTML(t('auth.signup_confirm_email'))}</div>`;
    } else {
      form.querySelectorAll('input, button').forEach(el => el.disabled = true);
      flash.innerHTML = `<div class="flash success">${t('auth.check_inbox')} <strong>${result.email}</strong>.</div>`;
    }
  } else {
    flash.innerHTML = `<div class="flash error">${escapeHTML(result.error)}</div>`;
  }
});

function escapeHTML(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
<script type="module" src="/src/page-motion.js"></script>
</body>
</html>
