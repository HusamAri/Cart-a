<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/scripts/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Sign in · Carta</title>
<meta name="description" content="Sign in to Carta with a magic link or password.">
<meta name="theme-color" content="#1B2A22">
<meta property="og:title" content="Sign in · Carta">
<meta property="og:description" content="Sign in to Carta with a magic link or password.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en">
<meta property="og:site_name" content="Carta">
<meta property="og:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=8">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Carta · F&amp;B Operations Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=8">

<link rel="icon" type="image/png" href="/assets/carta-favicon.png?v=7">
<link rel="apple-touch-icon" href="/assets/carta-apple-touch-icon.png?v=7">
<link rel="stylesheet" href="/styles/tokens.css">
<style>
  /* mode tabs */
  .mode-tabs {
    display: inline-flex; gap: 4px;
    padding: 4px;
    background: var(--surface-container);
    border-radius: var(--r-pill);
    margin: var(--sp-6) 0 var(--sp-3);
  }
  .mode-tabs button {
    background: transparent; border: 0;
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-caption);
    letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant);
    padding: 8px 18px;
    border-radius: var(--r-pill);
    cursor: pointer;
    transition: background var(--dur-2), color var(--dur-2);
  }
  .mode-tabs button.active {
    background: var(--primary);
    color: var(--on-primary);
  }
</style>
</head>
<body class="auth-screen">
<div class="auth-chrome-bar" style="position:fixed;top:16px;right:16px;z-index:70">
  <button type="button" class="carta-theme-btn" id="authThemeBtn" aria-label="">◐</button>
</div>

<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<main id="main">
<form class="auth-card" id="loginForm" novalidate aria-labelledby="login-h">
  <a href="/" class="site-logo" aria-label="Carta home"><img src="/assets/carta-brand-lockup-horizontal.png?v=8" alt="Carta · F&amp;B Operations Studio" width="1024" height="1024"></a>

  <span class="eyebrow eyebrow-accent" data-i18n="login.eyebrow">Sign in</span>
  <h1 class="h1" id="login-h" style="margin-top:var(--sp-3)"><em data-i18n="auth.welcome">Welcome back.</em></h1>
  <p class="lead" style="margin-top:var(--sp-4)" id="introCopy" data-i18n="auth.welcome_intro">Enter your email and we'll send a one-time link to sign in.</p>

  <div class="mode-tabs" role="group" aria-label="Sign-in method">
    <button type="button" data-mode="magic" class="active" aria-pressed="true" data-i18n="auth.tab_magic">Magic link</button>
    <button type="button" data-mode="password" aria-pressed="false" data-i18n="auth.tab_password">Password</button>
  </div>

  <div style="margin-top:var(--sp-5)">
    <label class="label" for="email" data-i18n="auth.label_email">Work email</label>
    <input type="email" id="email" name="email" class="input" placeholder="you@hotel.com" required autocomplete="email">
  </div>

  <div id="passwordRow" hidden style="margin-top:var(--sp-5)">
    <label class="label" for="password" data-i18n="auth.label_password">Password</label>
    <input type="password" id="password" name="password" class="input" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="margin-top:var(--sp-7)">
    <span id="submitLabel" data-i18n="auth.send_link">Send magic link</span>
    <span class="arrow">→</span>
  </button>

  <div id="flash" role="status" aria-live="polite"></div>

  <div class="thin-rule" style="margin:var(--sp-7) 0 var(--sp-5)"></div>

  <p style="font-size:var(--type-caption);color:var(--on-surface-variant);margin:0">
    <span data-i18n="auth.no_account">Don't have an account?</span>
    <a href="/app/signup.html" id="authSignupLink" style="color:var(--primary);font-weight:600;margin-left:6px" data-i18n="auth.signup_link">Begin →</a>
  </p>
</form>
</main>

<script type="module">
import { sendMagicLink, signInWithPassword } from '/src/auth.js';
import { getSessionAfterUrlAuth } from '/src/supabase-client.js';
import { storeInviteToken, readStoredInviteToken, storeSignupPlan } from '/src/workspaces.js';
import { applyTranslations, t } from '/src/i18n.js';
import { initTheme, cycleThemePref, getThemePref, themePrefGlyph } from '/src/theme.js';
applyTranslations();
initTheme();
function syncAuthThemeBtn() {
  const btn = document.getElementById('authThemeBtn');
  if (!btn) return;
  const pref = getThemePref();
  btn.textContent = themePrefGlyph(pref);
  const label = pref === 'system' ? t('ui.theme.aria_system') : pref === 'light' ? t('ui.theme.aria_light') : t('ui.theme.aria_dark');
  btn.setAttribute('aria-label', label);
  btn.title = label;
}
syncAuthThemeBtn();
document.getElementById('authThemeBtn')?.addEventListener('click', () => {
  cycleThemePref();
  syncAuthThemeBtn();
});
window.addEventListener('carta-theme-change', syncAuthThemeBtn);

const params = new URLSearchParams(window.location.search);
const inviteToken = (params.get('invite') || '').trim();
const prefillEmail = (params.get('email') || '').trim();
const signupPlan = (params.get('plan') || '').trim();
if (inviteToken) storeInviteToken(inviteToken);
if (signupPlan) storeSignupPlan(signupPlan);
const hasInviteToken = !!(inviteToken || readStoredInviteToken());

(() => {
  const token = inviteToken || readStoredInviteToken() || '';
  const qp = new URLSearchParams();
  if (token) qp.set('invite', token);
  if (prefillEmail) qp.set('email', prefillEmail);
  if (signupPlan) qp.set('plan', signupPlan);
  const q = qp.toString();
  const el = document.getElementById('authSignupLink');
  if (el) el.href = '/app/signup.html' + (q ? `?${q}` : '');
})();

(async () => {
  const session = await getSessionAfterUrlAuth();
  if (!session) return;
  const token = inviteToken || readStoredInviteToken() || '';
  window.location.replace(token ? `/app/?invite=${encodeURIComponent(token)}` : '/app/');
})();

const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const submitLabel = document.getElementById('submitLabel');
const flash = document.getElementById('flash');
const passwordRow = document.getElementById('passwordRow');
const introCopy = document.getElementById('introCopy');
const tabs = document.querySelectorAll('.mode-tabs [data-mode]');

if (prefillEmail) document.getElementById('email').value = prefillEmail;
if (hasInviteToken) {
  flash.innerHTML = `<div class="flash success">${escapeHTML(t('ws.invite_link_opened') || 'Invitation detected. Continue with magic link or password.')}</div>`;
}

let mode = 'magic';

function setMode(next) {
  mode = next;
  tabs.forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  if (mode === 'password') {
    passwordRow.hidden = false;
    submitLabel.textContent = t('auth.signin_btn');
    introCopy.textContent = t('auth.signin_intro');
  } else {
    passwordRow.hidden = true;
    submitLabel.textContent = t('auth.send_link');
    introCopy.textContent = t('auth.welcome_intro');
  }
}
tabs.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  submitBtn.disabled = true;
  submitLabel.innerHTML = '<span class="spinner"></span> ' + t('auth.sending');
  flash.innerHTML = '';

  let result;
  if (mode === 'password') {
    const password = document.getElementById('password').value;
    result = await signInWithPassword(email, password);
  } else {
    const tokenForRedirect = inviteToken || readStoredInviteToken() || '';
    result = await sendMagicLink(email, {
      allowSignup: hasInviteToken ? true : false,
      inviteToken: tokenForRedirect,
    });
  }

  submitBtn.disabled = false;
  submitLabel.textContent = mode === 'password' ? t('auth.signin_btn') : t('auth.send_link');

  if (result.ok) {
    if (mode === 'password') {
      const tok = inviteToken || readStoredInviteToken() || '';
      window.location.replace(tok ? `/app/?invite=${encodeURIComponent(tok)}` : '/app/');
    } else {
      form.querySelectorAll('input, button').forEach(el => el.disabled = true);
      flash.innerHTML = `<div class="flash success">${t('auth.check_inbox')} <strong>${result.email}</strong>.</div>`;
    }
  } else {
    flash.innerHTML = `<div class="flash error">${result.error}</div>`;
  }
});

function escapeHTML(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
<script type="module" src="/src/page-motion.js"></script>
</body>
</html>
