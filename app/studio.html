<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/scripts/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Studio · Carta</title>
<meta name="theme-color" content="#1B2A22">
<meta name="description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:title" content="Studio · Carta">
<meta property="og:description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en">
<meta property="og:site_name" content="Carta">
<meta property="og:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Carta · F&amp;B Operations Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<link rel="icon" type="image/png" href="/assets/carta-favicon.png?v=7">
<link rel="apple-touch-icon" href="/assets/carta-apple-touch-icon.png?v=7">
<link rel="stylesheet" href="/styles/tokens.css">
<style>
  .studio-page {
    padding: var(--sp-7) var(--margin-desktop) var(--sp-10);
    flex: 1; overflow-y: auto;
  }
  @media (max-width: 900px) {
    .studio-page { padding: var(--sp-5) var(--margin-mobile) var(--sp-8); }
  }

  .page-header {
    max-width: 1120px; margin: 0 auto var(--sp-8);
  }
  .page-header .eyebrow { margin-bottom: var(--sp-3); }
  .page-header h1 { margin: 0 0 var(--sp-4); }
  .page-header .lead { margin: 0; max-width: 56ch; }

  /* Bento: first card is the dashboard (two-column span) */
  .bento {
    max-width: 1120px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: var(--sp-5);
  }
  .bento > .module-card:first-child { grid-column: span 2; min-height: 280px; }
  .bento > .module-card:first-child .module-card__name { font-size: 2rem; }
  @media (max-width: 900px) {
    .bento { grid-template-columns: repeat(2, 1fr); }
    .bento > .module-card:first-child { grid-column: span 2; }
  }
  @media (max-width: 600px) {
    .bento { grid-template-columns: 1fr; }
    .bento > .module-card:first-child { grid-column: span 1; min-height: 220px; }
    .bento > .module-card:first-child .module-card__name { font-size: 1.625rem; }
  }

  .module-card {
    background: var(--surface-container-lowest);
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
    padding: var(--glass-padding);
    display: flex; flex-direction: column; gap: var(--sp-4);
    min-height: 220px;
    text-decoration: none; color: inherit;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    position: relative;
    transition:
      transform var(--dur-2) var(--ease-linear-out),
      background var(--dur-2) var(--ease-linear-out),
      box-shadow var(--dur-2),
      border-color var(--dur-2);
  }
  .module-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-inner-glow), var(--shadow-3);
    border-color: rgb(var(--ink-rgb) / 0.22);
  }
  .module-card:active {
    transform: translateY(-4px);
  }
  @media (prefers-reduced-motion: reduce) {
    .module-card:active { transform: none; }
  }
  .module-card:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 3px;
  }
  .module-card--sage { background: rgb(var(--sage-mist-rgb) / 0.85); color: var(--on-primary-fixed); }
  .module-card--gold { background: rgb(var(--honey-mist-rgb) / 0.55); color: var(--on-tertiary-fixed); }
  .module-card--ink  { background: var(--primary); color: var(--on-primary); }

  .module-card__icon {
    width: 48px; height: 48px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgb(var(--ink-rgb) / 0.06);
    border-radius: var(--r-lg);
    transition: background var(--dur-2), color var(--dur-2);
  }
  .module-card:hover:not(.module-card--ink) .module-card__icon {
    background: rgb(var(--honey-mist-rgb) / 0.22);
    color: var(--secondary);
  }
  .module-card--ink .module-card__icon {
    background: rgba(255,255,255,0.10);
    color: inherit;
  }
  .module-card--ink:hover .module-card__icon {
    background: rgba(255,255,255,0.18);
    color: var(--tertiary-container);
  }
  .module-card__icon .carta-icon {
    width: 28px; height: 28px;
    display: block;
  }

  .module-card__num {
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm);
    letter-spacing: var(--track-caps); text-transform: uppercase;
    opacity: 0.65;
  }
  .module-card__name {
    font-family: var(--font-display); font-weight: 400; font-style: italic;
    font-size: 1.625rem; line-height: 1.25;
    margin: 0;
  }
  .module-card__desc {
    font-family: var(--font-sans); font-size: var(--type-caption);
    line-height: 1.62;
    opacity: 0.88;
    margin: 0;
  }
  .module-card__cta {
    margin-top: auto;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm);
    letter-spacing: var(--track-caps); text-transform: uppercase;
  }
  .module-card__cta .arrow { transition: transform var(--dur-2) var(--ease); }
  .module-card:hover .module-card__cta .arrow { transform: translateX(6px); }
  .module-card__cta-coming {
    margin-top: auto;
    display: inline-flex; padding: 6px 14px;
    background: rgb(var(--ink-rgb) / 0.06);
    border-radius: var(--r-pill);
    font-family: var(--font-sans); font-size: 11px;
    font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase;
    opacity: 0.7;
    align-self: flex-start;
  }
  .module-card--ink .module-card__cta-coming { background: rgba(255,255,255,0.10); }

  /* Decorative frames between overview rows (same cell size as module cards) */
  .bento-frame {
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
    min-height: 220px;
    overflow: hidden;
    position: relative;
    pointer-events: none;
    user-select: none;
    background: var(--surface-container-low);
  }
  .bento-frame__img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 220px;
    object-fit: cover;
    object-position: center;
  }
  /* Overview bento: shift decor frames 3–5 right (editorial rhythm) */
  @media (min-width: 901px) {
    .bento > .bento-frame--shift-r1 { grid-column: 2; }
    .bento > .bento-frame--shift-r2 { grid-column: 3; }
  }
  @media (min-width: 601px) and (max-width: 900px) {
    .bento > .bento-frame--shift-r1 { grid-column: 2; }
    .bento > .bento-frame--shift-r2 { grid-column: 2; }
  }
  /* Module-card is .disabled when "coming soon" — give a different cursor */
  .module-card.disabled { cursor: default; }
  .module-card.disabled:hover { transform: none; box-shadow: var(--shadow-inner-glow), var(--shadow-2); }

  .studio-mast {
    max-width: min(720px, 92vw);
    margin: 0 auto var(--sp-8);
  }
  .studio-mast--lay-overview {
    max-width: min(580px, 92vw);
    margin: 0 0 var(--sp-8);
    margin-right: auto;
  }
  @media (max-width: 700px) {
    .studio-mast--lay-overview {
      margin-left: auto;
      margin-right: auto;
    }
  }
  .studio-mast__cell {
    margin: 0;
    padding: 8px;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
  }
  .studio-mast--lay-overview .studio-mast__cell.is-sealed {
    overflow: visible;
  }
  .studio-mast--lay-overview .studio-mast__cell {
    padding: 0;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4 / 3;
    max-height: min(320px, 44vh);
  }
  .studio-mast__cell--brand img {
    display: block;
    width: 100%;
    border-radius: var(--r-lg);
    background: var(--surface-container-low);
  }
  .studio-mast__cell--brand img.mast-hero--plate {
    aspect-ratio: 4 / 3;
    max-height: min(320px, 44vh);
    object-fit: cover;
    object-position: 50% 50%;
  }
  .studio-mast--lay-overview .studio-mast__cell--brand img.mast-hero--plate {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-height: none;
    aspect-ratio: unset;
    border-radius: var(--r-lg);
    object-fit: cover;
    object-position: 48% 42%;
  }
  @media (max-width: 700px) {
    .studio-mast__cell--brand img.mast-hero--plate { max-height: 240px; }
    .studio-mast--lay-overview .studio-mast__cell {
      max-height: 240px;
    }
  }
</style>
</head>
<body>
<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<!-- Studio shell (sidebar + main wrap) will be mounted via JS -->

<script type="module">
import { mountStudioShell } from '/src/studio-layout.js';
import { cartaIcon } from '/src/carta-icon.js';

/** Editorial assets for overview bento; assigned randomly per load (no duplicates within the page). */
const BENTO_DECOR_ASSETS = [
  '/assets/carta-editorial-breakfast.png',
  '/assets/carta-editorial-wine.png',
  '/assets/carta-hero-kitchen.png',
  '/assets/carta-editorial-notebook.png',
  '/assets/carta-editorial-divided.png',
  '/assets/carta-editorial-room-service.png',
  '/assets/carta-editorial-room-service-2.png',
  '/assets/carta-editorial-mood-a.png',
  '/assets/carta-editorial-mood-b.png',
  '/assets/carta-hero-bar.png',
  '/assets/carta-editorial-marble.png',
  '/assets/dashboard-carbon-accent.png',
];

function pickShuffledSlice(pool, n) {
  const a = [...pool];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

const BENTO_FRAME_FALLBACK = '/assets/carta-hero-plate.png';

function bentoFrameHtml(opts = {}) {
  const shift = Number(opts.shiftRight) || 0;
  const shiftClass = shift === 1 ? ' bento-frame--shift-r1' : shift === 2 ? ' bento-frame--shift-r2' : '';
  return `<div class="bento-frame${shiftClass}" aria-hidden="true"><img class="bento-frame__img" alt="" width="640" height="480" loading="lazy" decoding="async"></div>`;
}

function initBentoDecorFrames(root) {
  const imgs = root.querySelectorAll('.bento-frame__img');
  if (!imgs.length) return;
  const n = Math.min(imgs.length, BENTO_DECOR_ASSETS.length);
  const urls = pickShuffledSlice(BENTO_DECOR_ASSETS, n);
  imgs.forEach((img, i) => {
    img.src = urls[i] || BENTO_FRAME_FALLBACK;
    img.addEventListener('error', () => {
      if (img.dataset.fallback === '1') return;
      img.dataset.fallback = '1';
      img.src = BENTO_FRAME_FALLBACK;
    }, { once: true });
  });
}

const main = document.createElement('main');
main.id = 'main';
main.className = 'studio-page';
main.innerHTML = `
  <div class="page-header">
    <span class="eyebrow eyebrow-accent" data-i18n="studio.section">Studio</span>
    <h1 class="h1"><em data-i18n="studio.welcome">Welcome to your studio.</em></h1>
    <p class="lead" data-i18n="studio.welcome_intro">Menu intelligence in one studio. Start with the dashboard or open any module below.</p>
  </div>

  <div class="studio-mast studio-mast--lay-overview">
    <figure class="studio-mast__cell studio-mast__cell--brand is-sealed">
      <img class="is-brand-visual mast-hero--plate" src="/assets/carta-hero-plate.png" alt="Editorial photograph: composed plate and glassware representing craft and mise en place in a hotel F&amp;B studio." data-i18n-alt="studio.overview_mast_alt" width="1024" height="824" loading="lazy" decoding="async">
      <img class="carta-wax-seal carta-wax-seal--br" src="/assets/carta-wax-seal.png?v=8" alt="" width="480" height="480" decoding="async" aria-hidden="true">
    </figure>
  </div>

  <div class="bento">
    <a class="module-card module-card--ink" href="/app/studio/dashboard.html">
      <span class="module-card__icon">${cartaIcon('query_stats', { size: 28 })}</span>
      <span class="module-card__num" data-i18n="studio.card_num_dash">Menu overview</span>
      <h2 class="module-card__name" data-i18n="studio.m_dashboard">The dashboard</h2>
      <p class="module-card__desc" data-i18n="studio.d_dashboard">KPIs, macro mix, diet coverage, allergens, cost completeness — scoped to the whole menu or a cluster.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    <a class="module-card" href="/app/studio/recipes.html">
      <span class="module-card__icon">${cartaIcon('menu_fork_knife', { size: 28 })}</span>
      <span class="module-card__num">01 — Recipe</span>
      <h2 class="module-card__name" data-i18n="studio.m_builder">The builder</h2>
      <p class="module-card__desc" data-i18n="studio.d_builder">Dishes, ingredients, kcal · macros · allergens. Food and drinks.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    ${bentoFrameHtml()}

    <a class="module-card module-card--sage" href="/app/studio/menus.html">
      <span class="module-card__icon">${cartaIcon('restaurant_menu', { size: 28 })}</span>
      <span class="module-card__num">02 — Menus</span>
      <h2 class="module-card__name" data-i18n="studio.m_menus">My menus</h2>
      <p class="module-card__desc" data-i18n="studio.d_menus">Group recipes into menus for dashboards and reporting.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    <a class="module-card" href="/app/studio/ingredients.html">
      <span class="module-card__icon">${cartaIcon('nutrition', { size: 28 })}</span>
      <span class="module-card__num">03 — Pantry</span>
      <h2 class="module-card__name" data-i18n="studio.m_ing_db">The pantry</h2>
      <p class="module-card__desc" data-i18n="studio.d_ing_db">Browse Codex nutrient reference, filter by category, audit export, add custom rows.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    ${bentoFrameHtml()}

    <a class="module-card module-card--gold" href="/app/studio/presets.html">
      <span class="module-card__icon">${cartaIcon('collections_bookmark', { size: 28 })}</span>
      <span class="module-card__num">04 — Presets</span>
      <h2 class="module-card__name" data-i18n="studio.m_presets">Presets</h2>
      <p class="module-card__desc" data-i18n="studio.d_presets">Curated starter recipe packs for demos and onboarding.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    <a class="module-card module-card--gold" href="/app/studio/cost.html">
      <span class="module-card__icon">${cartaIcon('account_balance_wallet', { size: 28 })}</span>
      <span class="module-card__num">05 — Cost</span>
      <h2 class="module-card__name" data-i18n="studio.m_ledger">The ledger</h2>
      <p class="module-card__desc" data-i18n="studio.d_ledger">SAP MAP ingest. Map. Audit. Target GP. VAT-aware.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    ${bentoFrameHtml({ shiftRight: 2 })}

    <a class="module-card module-card--sage" href="/app/studio/pricing.html">
      <span class="module-card__icon">${cartaIcon('sell', { size: 28 })}</span>
      <span class="module-card__num">06 — Pricing</span>
      <h2 class="module-card__name" data-i18n="studio.m_pricing">The workspace</h2>
      <p class="module-card__desc" data-i18n="studio.d_pricing">Edit menu prices in place. FC%, margin, suggested price update live.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    <a class="module-card module-card--ink" href="/app/studio/matrix.html">
      <span class="module-card__icon">${cartaIcon('grid_view', { size: 28 })}</span>
      <span class="module-card__num">07 — Engineering</span>
      <h2 class="module-card__name" data-i18n="studio.m_matrix">The matrix</h2>
      <p class="module-card__desc" data-i18n="studio.d_matrix">Smith-Kasavana. Stars · Plowhorses · Puzzles · Dogs.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    ${bentoFrameHtml({ shiftRight: 1 })}

    <a class="module-card" href="/app/studio/variance.html">
      <span class="module-card__icon">${cartaIcon('analytics', { size: 28 })}</span>
      <span class="module-card__num">08 — Variance</span>
      <h2 class="module-card__name" data-i18n="studio.m_audit">The audit</h2>
      <p class="module-card__desc" data-i18n="studio.d_audit">Snapshot every upload. Top movers, anomalies, drop list.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    <a class="module-card" href="/app/studio/audit.html">
      <span class="module-card__icon">${cartaIcon('history', { size: 28 })}</span>
      <span class="module-card__num">09 — Activity</span>
      <h2 class="module-card__name" data-i18n="studio.m_activity">Activity log</h2>
      <p class="module-card__desc" data-i18n="studio.d_activity">Immutable-style timeline of workspace events for compliance review.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    <a class="module-card module-card--gold" href="/app/studio/surface.html">
      <span class="module-card__icon">${cartaIcon('ios_share', { size: 28 })}</span>
      <span class="module-card__num">10 — Surface</span>
      <h2 class="module-card__name" data-i18n="studio.m_surface">The output</h2>
      <p class="module-card__desc" data-i18n="studio.d_surface">Bilingual EN/TR. Excel import, PDF/PNG export.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>

    ${bentoFrameHtml({ shiftRight: 2 })}

    <a class="module-card" href="/app/studio/capabilities.html">
      <span class="module-card__icon">${cartaIcon('table_chart', { size: 28 })}</span>
      <span class="module-card__num" data-i18n="cap.eyebrow">Agents</span>
      <h2 class="module-card__name" data-i18n="studio.m_capabilities">Capability map</h2>
      <p class="module-card__desc" data-i18n="studio.d_capabilities">UI actions vs planned agent tools. Export JSON for MCP and parity reviews.</p>
      <span class="module-card__cta">
        <span data-i18n="studio.open">Open</span> <span class="arrow">→</span>
      </span>
    </a>
  </div>
`;

initBentoDecorFrames(main);
await mountStudioShell({ active: 'overview', main });
</script>
</body>
</html>
