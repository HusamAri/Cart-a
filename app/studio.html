<style>
  .studio-page {
    padding: var(--sp-7) var(--margin-desktop) var(--sp-10);
    flex: 1; overflow-y: auto;
  }
  @media (max-width: 900px) {
    .studio-page { padding: var(--sp-5) var(--margin-mobile) var(--sp-8); }
  }

  .page-header {
    max-width: 1120px; margin: 0 auto var(--sp-8);
  }
  .page-header .eyebrow { margin-bottom: var(--sp-3); }
  .page-header h1 { margin: 0 0 var(--sp-4); }
  .page-header .lead { margin: 0; max-width: 56ch; }

  /* Bento: first card is the dashboard (two-column span) */
  .bento {
    max-width: 1120px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: var(--sp-5);
  }
  .bento > .module-card:first-child { grid-column: span 2; min-height: 280px; }
  .bento > .module-card:first-child .module-card__name { font-size: 2rem; }
  @media (max-width: 900px) {
    .bento { grid-template-columns: repeat(2, 1fr); }
    .bento > .module-card:first-child { grid-column: span 2; }
  }
  @media (max-width: 600px) {
    .bento { grid-template-columns: 1fr; }
    .bento > .module-card:first-child { grid-column: span 1; min-height: 220px; }
    .bento > .module-card:first-child .module-card__name { font-size: 1.625rem; }
  }

  .module-card {
    background: var(--surface-container-lowest);
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
    padding: var(--glass-padding);
    display: flex; flex-direction: column; gap: var(--sp-4);
    min-height: 220px;
    text-decoration: none; color: inherit;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    position: relative;
    transition:
      transform var(--dur-2) var(--ease-linear-out),
      background var(--dur-2) var(--ease-linear-out),
      box-shadow var(--dur-2),
      border-color var(--dur-2);
  }
  .module-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-inner-glow), var(--shadow-3);
    border-color: rgb(var(--ink-rgb) / 0.22);
  }
  .module-card:active {
    transform: translateY(-4px);
  }
  @media (prefers-reduced-motion: reduce) {
    .module-card:active { transform: none; }
  }
  .module-card:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 3px;
  }
  .module-card--sage { background: rgb(var(--sage-mist-rgb) / 0.85); color: var(--on-primary-fixed); }
  .module-card--gold { background: rgb(var(--honey-mist-rgb) / 0.55); color: var(--on-tertiary-fixed); }
  .module-card--ink  { background: var(--primary); color: var(--on-primary); }

  .module-card__icon {
    width: 48px; height: 48px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgb(var(--ink-rgb) / 0.06);
    border-radius: var(--r-lg);
    transition: background var(--dur-2), color var(--dur-2);
  }
  .module-card:hover:not(.module-card--ink) .module-card__icon {
    background: rgb(var(--honey-mist-rgb) / 0.22);
    color: var(--secondary);
  }
  .module-card--ink .module-card__icon {
    background: rgba(255,255,255,0.10);
    color: inherit;
  }
  .module-card--ink:hover .module-card__icon {
    background: rgba(255,255,255,0.18);
    color: var(--tertiary-container);
  }
  .module-card__icon .carta-icon {
    width: 28px; height: 28px;
    display: block;
  }

  .module-card__num {
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm);
    letter-spacing: var(--track-caps); text-transform: uppercase;
    opacity: 0.65;
  }
  .module-card__name {
    font-family: var(--font-display); font-weight: 400; font-style: italic;
    font-size: 1.625rem; line-height: 1.25;
    margin: 0;
  }
  .module-card__desc {
    font-family: var(--font-sans); font-size: var(--type-caption);
    line-height: 1.62;
    opacity: 0.88;
    margin: 0;
  }
  .module-card__cta {
    margin-top: auto;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm);
    letter-spacing: var(--track-caps); text-transform: uppercase;
  }
  .module-card__cta .arrow { transition: transform var(--dur-2) var(--ease); }
  .module-card:hover .module-card__cta .arrow { transform: translateX(6px); }
  .module-card__cta-coming {
    margin-top: auto;
    display: inline-flex; padding: 6px 14px;
    background: rgb(var(--ink-rgb) / 0.06);
    border-radius: var(--r-pill);
    font-family: var(--font-sans); font-size: 11px;
    font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase;
    opacity: 0.7;
    align-self: flex-start;
  }
  .module-card--ink .module-card__cta-coming { background: rgba(255,255,255,0.10); }

  /* Module-card is .disabled when "coming soon" — give a different cursor */
  .module-card.disabled { cursor: default; }
  .module-card.disabled:hover { transform: none; box-shadow: var(--shadow-inner-glow), var(--shadow-2); }

  .studio-mast {
    max-width: 1120px;
    margin: 0 auto var(--sp-8);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--sp-4);
    align-items: start;
  }
  @media (max-width: 700px) {
    .studio-mast { grid-template-columns: 1fr; }
  }
  .studio-mast__cell {
    margin: 0;
    padding: 8px;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
  }
  .studio-mast__cell--brand img {
    aspect-ratio: auto;
    min-height: 200px;
    max-height: min(280px, 38vh);
    object-fit: contain;
    background: var(--surface-container-low);
  }
  @media (max-width: 700px) {
    .studio-mast__cell--brand img { max-height: 220px; }
  }
</style>
</head>
<body>

</html>
