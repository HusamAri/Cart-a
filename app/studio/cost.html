<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/scripts/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Cost Ledger · Carta</title>
<meta name="theme-color" content="#1B2A22">
<meta name="description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:title" content="Cost Ledger · Carta">
<meta property="og:description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en">
<meta property="og:site_name" content="Carta">
<meta property="og:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Carta · F&amp;B Operations Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<link rel="icon" type="image/png" href="/assets/carta-favicon.png?v=7">
<link rel="apple-touch-icon" href="/assets/carta-apple-touch-icon.png?v=7">
<link rel="stylesheet" href="/styles/tokens.css">
<style>
  .studio-page {
    padding: var(--sp-7) var(--margin-desktop) var(--sp-10);
    flex: 1; overflow-y: auto;
  }
  @media (max-width: 900px) {
    .studio-page { padding: var(--sp-5) var(--margin-mobile) var(--sp-8); }
  }

  .page-head {
    max-width: 1200px; margin: 0 auto var(--sp-8);
    display: grid; grid-template-columns: 1fr auto;
    gap: var(--sp-5); align-items: end;
  }
  @media (max-width: 760px) { .page-head { grid-template-columns: 1fr; } }
  .page-head__title .eyebrow { margin-bottom: var(--sp-3); }
  .page-head__title h1 { margin: 0 0 var(--sp-3); }
  .page-head__title .lead { margin: 0; max-width: 56ch; }
  .page-head__actions {
    display: flex; gap: var(--sp-3); align-items: center;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-pill);
    padding: 6px 6px 6px 18px;
  }
  .page-head__actions input {
    background: transparent; border: 0;
    font-family: var(--font-sans); font-size: var(--type-body);
    padding: 10px 8px; outline: none; min-width: 220px;
    color: var(--on-surface);
  }
  .page-head__actions input::placeholder { color: var(--outline); }
  .page-head__actions .divider { width: 1px; height: 24px; background: var(--outline-variant); }

  /* TABLE */
  .ledger {
    max-width: 1200px; margin: 0 auto;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-2xl);
    box-shadow: var(--shadow-2);
    overflow: hidden;
  }
  .ledger table { width: 100%; border-collapse: collapse; }
  .ledger thead th {
    text-align: left;
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm); letter-spacing: var(--track-caps);
    text-transform: uppercase; color: var(--on-surface-variant);
    padding: 16px var(--sp-5);
    border-bottom: 1px solid var(--outline-variant);
    background: var(--surface-container-low);
  }
  .ledger tbody td {
    padding: 14px var(--sp-5);
    border-bottom: 1px solid var(--outline-variant);
    font-family: var(--font-sans);
    font-size: var(--type-body);
    color: var(--on-surface);
    vertical-align: middle;
  }
  .ledger tbody tr:last-child td { border-bottom: 0; }
  .ledger tbody tr {
    cursor: pointer;
    transition: background var(--dur-2);
  }
  .ledger tbody tr:hover { background: rgba(255,255,255,0.7); }
  .ledger tbody tr:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .ledger .col-name {
    font-family: var(--font-display); font-style: italic; font-weight: 400;
    font-size: 1.1rem; color: var(--primary);
  }
  .ledger .col-num { font-variant-numeric: tabular-nums; text-align: right; }
  .ledger .col-tag { white-space: nowrap; }
  @media (max-width: 700px) {
    .ledger .hide-mobile { display: none; }
  }

  .empty {
    max-width: 600px; margin: var(--sp-9) auto;
    text-align: center;
    background: var(--surface-container-lowest);
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-2);
    padding: var(--sp-9) var(--sp-7);
  }
  .empty .eyebrow { margin-bottom: var(--sp-4); }
  .empty h2 { margin: 0 0 var(--sp-4); }
  .empty .lead { margin: 0 auto var(--sp-7); }

  /* MODAL — borrowed from recipes */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgb(var(--ink-rgb) / 0.48);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    padding: var(--sp-5);
    z-index: 100;
    animation: fadeIn 0.25s var(--ease-linear-out);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface-container-lowest);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-4);
    width: 100%; max-width: 680px;
    max-height: 92vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal__head {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--sp-5) var(--sp-6);
    border-bottom: 1px solid var(--outline-variant);
  }
  .modal__head h2 { margin: 0; }
  .modal__close {
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0;
    border-radius: var(--r-pill);
    color: var(--on-surface-variant);
    cursor: pointer;
  }
  .modal__close:hover { background: var(--surface-container); color: var(--primary); }
  .modal__close:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .modal__form { padding: var(--sp-6); overflow-y: auto; flex: 1; }
  .form-row { margin-bottom: var(--sp-4); }
  .form-grid-2 {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: var(--sp-4);
  }
  @media (max-width: 600px) { .form-grid-2 { grid-template-columns: 1fr; } }

  .eff-hint {
    margin: var(--sp-4) 0 0;
    padding: 12px 16px;
    background: var(--primary-fixed);
    color: var(--on-primary-fixed);
    border-radius: var(--r-lg);
    font-size: var(--type-caption);
    font-family: var(--font-sans);
  }
  .eff-hint b { font-family: var(--font-display); font-weight: 500; font-size: 1.1em; }

  .modal__foot {
    display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-6);
    border-top: 1px solid var(--outline-variant);
    background: var(--surface-container-low);
  }
  .modal__foot__right { display: flex; gap: var(--sp-3); }
  .btn-error {
    background: transparent; color: var(--error);
    border: 1px solid rgba(186,26,26,0.35);
  }
  .btn-error:hover { background: var(--error-container); color: var(--on-error-container); border-color: var(--error); }
</style>
</head>
<body>
<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<script type="module">
import { mountStudioShell } from '/src/studio-layout.js';
import { supabase } from '/src/supabase-client.js';
import { applyTranslations, t, getLang } from '/src/i18n.js';
import { formatNumber } from '/src/recipe-compute.js';
import { suggestNutrients } from '/src/nutrient-db.js';
import { applyRoleGates, requireCan } from '/src/permissions.js';
import { parseSapCostFile } from '/src/sap-cost-import.js';
import { downloadWorkbook } from '/src/xlsx-export.js';
import { cartaIcon } from '/src/carta-icon.js';

const main = document.createElement('main');
main.id = 'main';
main.className = 'studio-page';

const ctx = await mountStudioShell({ active: 'cost', main });
if (!ctx) throw new Error('No session/workspace');
const wsId = ctx.workspace.id;
const currency = ctx.workspace.currency || '₺';
const { role } = ctx;

main.innerHTML = `
  <div class="page-head">
    <div class="page-head__title">
      <span class="eyebrow eyebrow-accent" data-i18n="cost.title">Cost</span>
      <h1 class="h1">
        <span data-i18n="cost.title">Cost</span>
        <em data-i18n="cost.title_em">ledger</em>.
      </h1>
      <p class="lead" data-i18n="cost.intro">Per-ingredient cost. Yield-aware. SAP-compatible.</p>
    </div>
    <div class="page-head__actions">
      ${cartaIcon('search', { size: 20, style: 'color:var(--outline)' })}
      <input id="searchInput" type="search" data-i18n-ph="cost.search_ph" autocomplete="off">
      <span class="divider" aria-hidden="true"></span>
      <input type="file" id="sapImportFile" accept=".csv,.txt,.xlsx,.xls,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
      <button type="button" class="btn btn-outline btn-sm" id="sapImportBtn" data-require="cost_create" title="">
        ${cartaIcon('upload_file', { size: 18 })}
        <span data-i18n="cost.import_sap">SAP / Excel</span>
      </button>
      <button type="button" class="btn btn-ghost btn-sm" id="sapTemplateBtn" data-i18n-title="cost.import_template_hint">
        ${cartaIcon('download', { size: 18 })}
        <span data-i18n="cost.import_template">Template</span>
      </button>
      <button class="btn btn-primary btn-sm" id="newBtn" data-require="cost_create">
        ${cartaIcon('add', { size: 18 })}
        <span data-i18n="cost.new">New entry</span>
      </button>
    </div>
  </div>

  <div class="studio-panel-visual">
    <figure class="studio-panel-visual__cell" style="--ar-w:824; --ar-h:1024;"><img class="is-brand-visual" src="/assets/carta-editorial-marble.png" alt="Brass-accented marble surface with stationery, suggesting a cost ledger desk." data-i18n-alt="img.alt.marble_ledger" width="824" height="1024" loading="lazy" decoding="async"></figure>
  </div>

  <p id="costImportHelp" class="text-muted" style="max-width:1200px;margin:0 auto var(--sp-4);font-size:var(--type-caption);line-height:1.5;padding:0 var(--sp-2)" data-i18n="cost.import_help"></p>
  <div id="listOrEmpty"></div>
`;
applyTranslations();
const ph = main.querySelector('[data-i18n-ph]'); if (ph) ph.placeholder = t(ph.getAttribute('data-i18n-ph'));
applyRoleGates(role, main);

let allEntries = [];

async function loadEntries() {
  const { data, error } = await supabase
    .from('cost_db')
    .select('*')
    .eq('workspace_id', wsId)
    .order('ingredient_name', { ascending: true });
  if (error) {
    console.error('loadEntries', error);
    main.querySelector('#listOrEmpty').innerHTML = `<p class="flash error" style="max-width:600px;margin:var(--sp-6) auto">${error.message}</p>`;
    return;
  }
  allEntries = data || [];
  render();
}

function render(filter = '') {
  const container = main.querySelector('#listOrEmpty');
  let items = allEntries;
  if (filter) {
    const q = filter.toLowerCase();
    items = items.filter(e => (e.ingredient_name || '').toLowerCase().includes(q) || (e.sap_code || '').toLowerCase().includes(q));
  }
  if (allEntries.length === 0) {
    container.innerHTML = renderEmpty();
    container.querySelector('#emptyNewBtn').addEventListener('click', () => openEditor(null));
    applyTranslations();
    applyRoleGates(role, container);
    return;
  }
  if (items.length === 0) {
    container.innerHTML = `<p style="text-align:center;margin:var(--sp-9) auto;max-width:400px;color:var(--on-surface-variant)" data-i18n="cost.no_results">${t('cost.no_results')}</p>`;
    applyTranslations();
    applyRoleGates(role, container);
    return;
  }
  container.innerHTML = `
    <div class="ledger">
      <table aria-label="Cost ledger">
        <thead>
          <tr>
            <th scope="col" data-i18n="cost.col_ingredient">Ingredient</th>
            <th scope="col" class="col-num" data-i18n="cost.col_price">Per 100g</th>
            <th scope="col" class="col-num hide-mobile" data-i18n="cost.col_yield">Yield</th>
            <th scope="col" class="hide-mobile" data-i18n="cost.col_source">Source</th>
            <th scope="col" class="hide-mobile" data-i18n="cost.col_as_of">As of</th>
          </tr>
        </thead>
        <tbody>${items.map(rowMarkup).join('')}</tbody>
      </table>
    </div>
  `;
  applyTranslations();
  container.querySelectorAll('[data-row-id]').forEach(tr => {
    tr.addEventListener('click', () => {
      const id = tr.getAttribute('data-row-id');
      const e = allEntries.find(x => uniqueKey(x) === id);
      if (e) openEditor(e);
    });
    tr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tr.click(); }
    });
  });
}

function rowMarkup(e) {
  const id = uniqueKey(e);
  const sourceLabel = t('cost.source_' + (e.source || 'manual').toLowerCase()) || e.source;
  return `
    <tr tabindex="0" role="button" data-row-id="${escapeHTML(id)}" aria-label="${escapeHTML(e.ingredient_name)}">
      <td class="col-name">${escapeHTML(e.ingredient_name)}</td>
      <td class="col-num">${escapeHTML(currency)} ${formatNumber(e.per_100g, 2)}</td>
      <td class="col-num hide-mobile">${formatNumber(e.yield_pct ?? 100, 0)}%</td>
      <td class="col-tag hide-mobile"><span class="chip ${e.source === 'SAP' ? 'chip-mist' : ''}" style="font-size:11px">${escapeHTML(sourceLabel)}</span></td>
      <td class="hide-mobile" style="color:var(--on-surface-variant);font-size:13px">${e.as_of ? new Date(e.as_of).toLocaleDateString() : '—'}</td>
    </tr>
  `;
}

function renderEmpty() {
  return `
    <div class="empty">
      <span class="accent-rule" style="margin:0 auto var(--sp-4)"></span>
      <span class="eyebrow eyebrow-accent" data-i18n="cost.empty_eyebrow">First entry</span>
      <h2 class="h1" style="margin-top:var(--sp-3)"><em data-i18n="cost.empty_title">Start your cost ledger.</em></h2>
      <p class="lead" data-i18n="cost.empty_intro">Add ingredients with their per-100g price and yield %.</p>
      <button class="btn btn-primary btn-lg" id="emptyNewBtn" data-require="cost_create">
        ${cartaIcon('add', { size: 18 })}
        <span data-i18n="cost.new">New entry</span>
      </button>
    </div>
  `;
}

main.querySelector('#newBtn').addEventListener('click', () => openEditor(null));
main.querySelector('#searchInput').addEventListener('input', (e) => render(e.target.value));

function downloadSapCostTemplate() {
  const today = new Date().toISOString().slice(0, 10);
  downloadWorkbook('carta-sap-cost-template.xls', [{
    name: 'SAP_COST',
    rows: [
      [
        { v: 'ingredient_name', t: 'String' },
        { v: 'sap_code', t: 'String' },
        { v: 'moving_price', t: 'String' },
        { v: 'price_unit_kg', t: 'String' },
        { v: 'yield_pct', t: 'String' },
        { v: 'as_of', t: 'String' },
      ],
      ['domates', 'MAT10001', '15', '1', '100', today],
      ['zeytinyağı', 'MAT10002', '920', '1', '95', today],
    ],
  }]);
}

async function runSapImport(ev) {
  if (!requireCan(role, 'cost_create', t('cost.import_denied'))) return;
  const f = ev.target.files?.[0];
  ev.target.value = '';
  if (!f) return;
  const { rows, errors, skipped } = await parseSapCostFile(f);
  if (errors.length && !rows.length) {
    const key = errors[0];
    const msg = t(`cost.import_err_${key}`) || key;
    alert(msg);
    return;
  }
  if (!rows.length) {
    alert(t('cost.import_err_no_rows'));
    return;
  }
  const ok = confirm(t('cost.import_confirm').replace('{n}', String(rows.length)).replace('{s}', String(skipped)));
  if (!ok) return;
  const today = new Date().toISOString().slice(0, 10);
  const chunk = 80;
  let done = 0;
  let lastErr = null;
  for (let i = 0; i < rows.length; i += chunk) {
    const part = rows.slice(i, i + chunk).map(r => ({
      workspace_id: wsId,
      ingredient_name: r.ingredient_name,
      per_100g: r.per_100g,
      yield_pct: r.yield_pct,
      uom: '100G',
      source: 'SAP',
      as_of: r.as_of || today,
      sap_code: r.sap_code,
      original_price: null,
    }));
    const { error } = await supabase.from('cost_db').upsert(part, { onConflict: 'workspace_id,ingredient_name' });
    if (error) {
      lastErr = error.message;
      break;
    }
    done += part.length;
  }
  if (lastErr) {
    alert(t('cost.import_partial').replace('{n}', String(done)).replace('{e}', lastErr));
  } else {
    alert(t('cost.import_done').replace('{n}', String(done)).replace('{s}', String(skipped)));
  }
  await loadEntries();
}

main.querySelector('#sapTemplateBtn').addEventListener('click', () => downloadSapCostTemplate());
main.querySelector('#sapImportBtn').addEventListener('click', () => main.querySelector('#sapImportFile').click());
main.querySelector('#sapImportFile').addEventListener('change', runSapImport);

// ============================================================
// Modal editor
// ============================================================
function openEditor(entry) {
  const editor = buildEditorEl(entry);
  document.body.appendChild(editor);
  applyRoleGates(role, editor);
  const onKey = (e) => { if (e.key === 'Escape') closeEditor(); };
  document.addEventListener('keydown', onKey);
  editor._cleanup = () => document.removeEventListener('keydown', onKey);
  setTimeout(() => editor.querySelector('#editName')?.focus(), 50);
}
function closeEditor() {
  const e = document.getElementById('costEditor');
  if (e) { e._cleanup?.(); e.remove(); }
}

function buildEditorEl(entry) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'costEditor';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-labelledby', 'costEditorTitle');

  const isEdit = !!entry;
  const e = entry || { ingredient_name:'', per_100g:'', yield_pct:100, uom:'100G', source:'manual', as_of:'', sap_code:'' };
  // Single action gates every editable surface in this modal.
  // Read-only roles (chef, viewer) get disabled inputs + hidden save/delete.
  const editAction = isEdit ? 'cost_update' : 'cost_create';

  wrap.innerHTML = `
    <div class="modal">
      <header class="modal__head">
        <h2 class="h2" id="costEditorTitle" data-i18n="${isEdit?'cost.edit_title':'cost.new_title'}">${isEdit?'Edit cost entry':'New cost entry'}</h2>
        <button class="modal__close" aria-label="Close" id="editorClose">
          ${cartaIcon('close', { size: 24 })}
        </button>
      </header>
      <form class="modal__form" id="costForm" novalidate>
        <div class="form-row" style="position:relative">
          <label class="label" for="editName" data-i18n="cost.col_ingredient">Ingredient</label>
          <input class="input" id="editName" type="text" required value="${escapeHTML(e.ingredient_name)}" ${isEdit?'readonly':''} autocomplete="off" data-require-disable="${editAction}">
        </div>
        <div class="form-grid-2">
          <div class="form-row">
            <label class="label" for="editPrice" data-i18n="cost.label_price_per_100g">Price per 100g</label>
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-family:var(--font-display);color:var(--on-surface-variant)">${escapeHTML(currency)}</span>
              <input class="input" id="editPrice" type="number" min="0" step="0.01" required value="${e.per_100g ?? ''}" data-require-disable="${editAction}">
            </div>
          </div>
          <div class="form-row">
            <label class="label" for="editYield" data-i18n="cost.label_yield">Yield (%)</label>
            <input class="input" id="editYield" type="number" min="1" max="100" step="0.1" value="${e.yield_pct ?? 100}" data-require-disable="${editAction}">
          </div>
        </div>
        <div class="form-grid-2">
          <div class="form-row">
            <label class="label" for="editUom" data-i18n="cost.label_uom">UOM</label>
            <input class="input" id="editUom" type="text" maxlength="8" value="${escapeHTML(e.uom || '100G')}" data-require-disable="${editAction}">
          </div>
          <div class="form-row">
            <label class="label" for="editSource" data-i18n="cost.label_source">Source</label>
            <select class="input" id="editSource" data-require-disable="${editAction}">
              <option value="manual" ${e.source==='manual'?'selected':''} data-i18n="cost.source_manual">Manual</option>
              <option value="SAP"    ${e.source==='SAP'?'selected':''}    data-i18n="cost.source_sap">SAP</option>
              <option value="csv"    ${e.source==='csv'?'selected':''}    data-i18n="cost.source_csv">CSV</option>
            </select>
          </div>
        </div>
        <div class="form-grid-2">
          <div class="form-row">
            <label class="label" for="editAsOf" data-i18n="cost.label_as_of">As of</label>
            <input class="input" id="editAsOf" type="date" value="${e.as_of || ''}" data-require-disable="${editAction}">
          </div>
          <div class="form-row">
            <label class="label" for="editSap" data-i18n="cost.label_sap_code">SAP code</label>
            <input class="input" id="editSap" type="text" value="${escapeHTML(e.sap_code || '')}" data-require-disable="${editAction}">
          </div>
        </div>
        <p class="eff-hint" id="effHint">—</p>
      </form>
      <footer class="modal__foot">
        <div>
          ${isEdit ? `<button type="button" class="btn btn-sm btn-error" id="deleteBtn" data-i18n="cost.delete" data-require="cost_delete">Delete</button>` : ''}
        </div>
        <div class="modal__foot__right">
          <button type="button" class="btn btn-ghost" id="cancelBtn" data-i18n="cost.cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveBtn" data-require="${editAction}">
            <span data-i18n="cost.save">Save</span> <span class="arrow">→</span>
          </button>
        </div>
      </footer>
    </div>
  `;

  // Autocomplete on name (only for new entries) — fixed + body so modal overflow does not clip
  if (!isEdit) {
    const nameInput = wrap.querySelector('#editName');
    let dropdown;
    let acOnScrollOrResize;
    function positionDropdown() {
      if (!dropdown) return;
      const r = nameInput.getBoundingClientRect();
      dropdown.style.left = `${Math.max(8, r.left)}px`;
      dropdown.style.top = `${r.bottom + 4}px`;
      dropdown.style.width = `${Math.min(r.width, window.innerWidth - 16)}px`;
    }
    nameInput.addEventListener('input', () => {
      const q = nameInput.value.trim();
      if (!q) { closeAC(); return; }
      const suggestions = suggestNutrients(q, 6);
      closeAC();
      if (!suggestions.length) return;
      dropdown = document.createElement('div');
      dropdown.style.cssText = 'position:fixed;z-index:10050;background:var(--surface-container-lowest);border:var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--shadow-2);max-height:200px;overflow-y:auto';
      dropdown.innerHTML = suggestions.map(s => `<div style="padding:10px 14px;cursor:pointer;font-size:var(--type-caption)" role="option" data-name="${escapeHTML(s)}">${escapeHTML(s)}</div>`).join('');
      dropdown.querySelectorAll('[data-name]').forEach(item => {
        item.addEventListener('mouseenter', () => { item.style.background = 'var(--surface-container)'; });
        item.addEventListener('mouseleave', () => { item.style.background = 'transparent'; });
        item.addEventListener('mousedown', (ev) => {
          ev.preventDefault();
          nameInput.value = item.getAttribute('data-name');
          closeAC();
        });
      });
      document.body.appendChild(dropdown);
      positionDropdown();
      acOnScrollOrResize = () => { closeAC(); };
      window.addEventListener('scroll', acOnScrollOrResize, true);
      window.addEventListener('resize', acOnScrollOrResize);
    });
    nameInput.addEventListener('blur', () => setTimeout(closeAC, 150));
    function closeAC() {
      if (acOnScrollOrResize) {
        window.removeEventListener('scroll', acOnScrollOrResize, true);
        window.removeEventListener('resize', acOnScrollOrResize);
        acOnScrollOrResize = null;
      }
      if (dropdown) { dropdown.remove(); dropdown = null; }
    }
  }

  // Compute "effective per gram" hint
  function updateHint() {
    const price = parseFloat(wrap.querySelector('#editPrice').value);
    const yld   = parseFloat(wrap.querySelector('#editYield').value) || 100;
    if (!isFinite(price) || price <= 0) { wrap.querySelector('#effHint').textContent = '—'; return; }
    const perGram = (price / 100) * (100 / yld);
    wrap.querySelector('#effHint').innerHTML = `${t('cost.eff_per_g')}: <b>${escapeHTML(currency)} ${formatNumber(perGram, 4)}</b> / g`;
  }
  wrap.querySelector('#costForm').addEventListener('input', updateHint);
  updateHint();

  // Close
  wrap.querySelector('#editorClose').addEventListener('click', closeEditor);
  wrap.querySelector('#cancelBtn').addEventListener('click', closeEditor);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeEditor(); });

  // Save
  wrap.querySelector('#saveBtn').addEventListener('click', async () => {
    const name = wrap.querySelector('#editName').value.trim();
    const price = parseFloat(wrap.querySelector('#editPrice').value);
    if (!name) { wrap.querySelector('#editName').focus(); return; }
    if (!isFinite(price) || price <= 0) { wrap.querySelector('#editPrice').focus(); return; }
    const payload = {
      workspace_id: wsId,
      ingredient_name: name,
      per_100g: price,
      yield_pct: parseFloat(wrap.querySelector('#editYield').value) || 100,
      uom:      wrap.querySelector('#editUom').value.trim() || '100G',
      source:   wrap.querySelector('#editSource').value || 'manual',
      as_of:    wrap.querySelector('#editAsOf').value || null,
      sap_code: wrap.querySelector('#editSap').value.trim() || null,
    };
    const saveBtn = wrap.querySelector('#saveBtn');
    saveBtn.disabled = true;
    try {
      // cost_db has composite PK (workspace_id, ingredient_name) — upsert
      const { error } = await supabase.from('cost_db').upsert(payload, { onConflict: 'workspace_id,ingredient_name' });
      if (error) throw error;
      closeEditor();
      await loadEntries();
    } catch (err) {
      console.error('save cost', err);
      alert((err && err.message) || 'Save failed');
      saveBtn.disabled = false;
    }
  });

  // Delete
  if (isEdit) {
    wrap.querySelector('#deleteBtn').addEventListener('click', async () => {
      if (!confirm(t('cost.delete_confirm'))) return;
      const { error } = await supabase.from('cost_db')
        .delete()
        .eq('workspace_id', wsId)
        .eq('ingredient_name', entry.ingredient_name);
      if (error) { alert(error.message); return; }
      closeEditor();
      await loadEntries();
    });
  }

  applyTranslations();
  return wrap;
}

function uniqueKey(e) {
  return `${e.workspace_id}::${e.ingredient_name}`;
}

function escapeHTML(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

await loadEntries();

document.getElementById('sidebarLangBtn')?.addEventListener('click', () => {
  setTimeout(() => {
    const q = main.querySelector('#searchInput')?.value || '';
    render(q);
    applyRoleGates(role, main);
  }, 0);
});
</script>
</body>
</html>
