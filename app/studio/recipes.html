<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/scripts/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Recipes · Carta</title>
<meta name="theme-color" content="#1B2A22">
<meta name="description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:title" content="Recipes · Carta">
<meta property="og:description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en">
<meta property="og:site_name" content="Carta">
<meta property="og:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Carta · F&amp;B Operations Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<link rel="icon" type="image/png" href="/assets/carta-favicon.png?v=7">
<link rel="apple-touch-icon" href="/assets/carta-apple-touch-icon.png?v=7">
<link rel="stylesheet" href="/styles/tokens.css">
<style>
  .studio-page {
    padding: var(--sp-7) var(--margin-desktop) var(--sp-10);
    flex: 1; overflow-y: auto;
  }
  @media (max-width: 900px) {
    .studio-page { padding: var(--sp-5) var(--margin-mobile) var(--sp-8); }
  }

  .page-head {
    max-width: 1200px; margin: 0 auto var(--sp-8);
    display: grid; grid-template-columns: 1fr auto;
    gap: var(--sp-5); align-items: end;
  }
  @media (max-width: 760px) { .page-head { grid-template-columns: 1fr; } }
  .page-head__title .eyebrow { margin-bottom: var(--sp-3); }
  .page-head__title h1 { margin: 0 0 var(--sp-3); }
  .page-head__title .lead { margin: 0; max-width: 52ch; }
  .page-head__actions {
    display: flex; gap: var(--sp-3); align-items: center;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-pill);
    padding: 6px 6px 6px 18px;
  }
  .page-head__actions input {
    background: transparent; border: 0;
    font-family: var(--font-sans); font-size: var(--type-body);
    padding: 10px 8px; outline: none; min-width: 220px;
    color: var(--on-surface);
  }
  .page-head__actions input::placeholder { color: var(--outline); }
  .page-head__actions .divider { width: 1px; height: 24px; background: var(--outline-variant); }

  /* GRID */
  .recipes-grid {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: var(--sp-5);
  }
  @media (max-width: 1000px) { .recipes-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px)  { .recipes-grid { grid-template-columns: 1fr; } }

  .recipe-card {
    background: var(--surface-container-lowest);
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-2);
    padding: var(--glass-padding);
    display: flex; flex-direction: column; gap: var(--sp-4);
    text-align: left; cursor: pointer;
    font-family: var(--font-sans);
    color: inherit;
    text-decoration: none;
    transition: transform var(--dur-2) var(--ease-linear-out), box-shadow var(--dur-2);
  }
  .recipe-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-3); }
  .recipe-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

  .recipe-card__kind { align-self: flex-start; }
  .recipe-card__name {
    font-family: var(--font-display); font-style: italic; font-weight: 400;
    font-size: 1.5rem; line-height: 1.2;
    color: var(--primary);
    margin: 0;
  }
  .recipe-card__meta {
    display: flex; gap: var(--sp-4);
    font-family: var(--font-sans);
    font-size: var(--type-caption);
    color: var(--on-surface-variant);
  }
  .recipe-card__meta .num { font-family: var(--font-display); font-weight: 500; color: var(--primary); font-size: 1.25rem; line-height: 1; display: block; margin-bottom: 2px; }
  .recipe-card__tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

  /* EMPTY STATE */
  .empty {
    max-width: 600px; margin: var(--sp-9) auto;
    text-align: center;
    background: var(--surface-container-lowest);
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-2);
    padding: var(--sp-9) var(--sp-7);
  }
  .empty .eyebrow { margin-bottom: var(--sp-4); }
  .empty h2 { margin: 0 0 var(--sp-4); }
  .empty .lead { margin: 0 auto var(--sp-7); }

  /* MODAL */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgb(var(--ink-rgb) / 0.48);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    padding: var(--sp-5);
    z-index: 100;
    animation: fadeIn 0.25s var(--ease-linear-out);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface-container-lowest);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-radius: var(--r-2xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-4);
    width: 100%; max-width: 920px;
    max-height: 92vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal__head {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--sp-5) var(--sp-6);
    border-bottom: 1px solid var(--outline-variant);
  }
  .modal__head h2 { margin: 0; }
  .modal__close {
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0;
    border-radius: var(--r-pill);
    color: var(--on-surface-variant);
    cursor: pointer;
  }
  .modal__close:hover { background: var(--surface-container); color: var(--primary); }
  .modal__close:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .modal__body {
    display: grid; grid-template-columns: 1.5fr 1fr;
    gap: 0;
    overflow: hidden;
    flex: 1;
  }
  @media (max-width: 800px) { .modal__body { grid-template-columns: 1fr; } }

  .modal__form { padding: var(--sp-6); overflow-y: auto; }
  .modal__preview {
    background: var(--surface-container-low);
    padding: var(--sp-6);
    overflow-y: auto;
    border-left: 1px solid var(--outline-variant);
  }
  @media (max-width: 800px) {
    .modal__preview { border-left: 0; border-top: 1px solid var(--outline-variant); }
  }

  .form-row { margin-bottom: var(--sp-5); }
  .form-row .label { margin-bottom: 8px; }

  /* Segmented kind toggle */
  .seg {
    display: inline-flex; gap: 4px; padding: 4px;
    background: var(--surface-container);
    border-radius: var(--r-pill);
  }
  .seg button {
    background: transparent; border: 0;
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm);
    letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant);
    min-height: 40px; padding: 8px 18px;
    border-radius: var(--r-pill);
    cursor: pointer;
    transition: background var(--dur-2), color var(--dur-2);
  }
  .seg button[aria-pressed="true"] {
    background: var(--primary); color: var(--on-primary);
  }
  .seg button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Ingredient rows */
  .ing-list { display: flex; flex-direction: column; gap: var(--sp-3); }
  .ing-row {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) 88px minmax(120px, 1fr) 44px;
    gap: 8px; align-items: start;
    position: relative;
  }
  .ing-row .col-unit .input { padding-right: 28px; }
  @media (max-width: 600px) {
    .ing-row {
      grid-template-columns: 1fr 1fr 44px;
      gap: 10px;
    }
    .ing-row .col-name { grid-column: 1 / -1; }
    .ing-row .col-brand { grid-column: 1 / -1; }
    .ing-row .col-amount { grid-column: 1; }
    .ing-row .col-unit { grid-column: 2; }
    .ing-row .col-rm { grid-column: 3; grid-row: 2; align-self: center; }
    .ing-row .input,
    .ing-row select.input {
      font-size: 16px;
      min-height: 44px;
    }
  }
  .ing-row .input { padding: 10px 14px; font-size: var(--type-body); }
  .ing-row .rm-btn {
    width: 40px; height: 40px;
    background: transparent; border: 0;
    border-radius: var(--r-pill);
    color: var(--outline);
    cursor: pointer;
  }
  .ing-row .rm-btn:hover { background: var(--error-container); color: var(--on-error-container); }
  .ing-row .rm-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Autocomplete — fixed to viewport in JS so modal overflow does not clip it */
  .ac-dropdown {
    position: fixed;
    left: 0; top: 0;
    min-width: 120px;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    max-height: min(280px, 42vh); overflow-y: auto;
    z-index: 10050;
    -webkit-overflow-scrolling: touch;
  }
  .ac-item {
    padding: 12px 14px;
    min-height: 44px;
    cursor: pointer;
    font-size: var(--type-caption);
    color: var(--on-surface);
  }
  .ac-item:hover, .ac-item[aria-selected="true"] { background: var(--surface-container); }
  .ac-empty { padding: 10px 14px; font-size: var(--type-caption); color: var(--outline); }

  /* Live preview panel */
  .preview-eyebrow { display: block; margin-bottom: var(--sp-4); }
  .preview-kcal {
    font-family: var(--font-display); font-weight: 400;
    font-size: 3.5rem; line-height: 1; letter-spacing: var(--track-display);
    color: var(--primary);
    margin: 0;
  }
  .preview-kcal-unit {
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm);
    letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant);
    display: block; margin-top: 4px;
  }
  .preview-section { margin-top: var(--sp-6); }
  .preview-section h4 {
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--type-label-sm); letter-spacing: var(--track-caps);
    text-transform: uppercase; color: var(--on-surface-variant);
    margin: 0 0 var(--sp-3);
  }
  .macros { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .macro {
    background: var(--surface-container-lowest);
    border-radius: var(--r-lg);
    padding: 12px 14px;
    display: flex; flex-direction: column;
    border: 1px solid var(--outline-variant);
  }
  .macro__label { font-family: var(--font-sans); font-size: 12px; color: var(--on-surface-variant); }
  .macro__value { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; color: var(--primary); }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .text-muted { color: var(--on-surface-variant); font-size: var(--type-caption); margin: 0; }

  /* Modal footer */
  .modal__foot {
    display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-6);
    border-top: 1px solid var(--outline-variant);
    background: var(--surface-container-low);
  }
  .modal__foot__right { display: flex; gap: var(--sp-3); }
  .btn-error {
    background: transparent; color: var(--error);
    border: 1px solid rgba(186,26,26,0.35);
  }
  .btn-error:hover { background: var(--error-container); color: var(--on-error-container); border-color: var(--error); }

  .name-row-actions {
    display: flex; gap: var(--sp-3); align-items: stretch; width: 100%;
  }
  .name-row-actions .input { flex: 1; min-width: 0; }
  .name-row-actions .btn { flex-shrink: 0; align-self: stretch; }

  .serving-pills {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--sp-3);
  }
  .serving-pills .serving-pill {
    min-height: 36px; padding: 6px 14px; border-radius: var(--r-pill);
    border: 1px solid var(--outline-variant);
    background: var(--surface-container-lowest);
    font-family: var(--font-sans); font-weight: 600; font-size: 12px;
    letter-spacing: var(--track-caps); text-transform: uppercase;
    cursor: pointer; color: var(--on-surface-variant);
    transition: background var(--dur-2), color var(--dur-2), border-color var(--dur-2);
  }
  .serving-pills .serving-pill:hover { border-color: var(--primary); color: var(--primary); }
  .serving-pills .serving-pill.is-active {
    background: var(--primary); color: var(--on-primary); border-color: var(--primary);
  }
  .serving-pills .serving-pill:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .paste-panel {
    margin-top: var(--sp-2);
    padding: var(--sp-5);
    background: rgb(var(--ink-rgb) / 0.04);
    border-radius: var(--r-xl);
    border: 1px solid var(--outline-variant);
  }
  .paste-toolbar {
    display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; margin-top: var(--sp-4);
  }
  .paste-replace-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: var(--type-caption); cursor: pointer; user-select: none;
  }
  .paste-preview {
    margin-top: var(--sp-4); font-size: var(--type-caption);
    max-height: 200px; overflow: auto;
    border: 1px solid var(--outline-variant); border-radius: var(--r-lg);
    background: rgba(255,255,255,0.65);
  }
  .paste-preview table { width: 100%; border-collapse: collapse; }
  .paste-preview th, .paste-preview td {
    padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--outline-variant);
  }
  .paste-preview th { font-size: 10px; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--on-surface-variant); }
  .paste-warn { color: var(--error); margin-top: var(--sp-3); font-size: var(--type-caption); }
</style>
</head>
<body>
<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<script type="module">
import { mountStudioShell } from '/src/studio-layout.js';
import { supabase } from '/src/supabase-client.js';
import { applyTranslations, t, getLang } from '/src/i18n.js';
import { ALLERGEN_LABELS, lookupNutrient, ingredientLabel } from '/src/nutrient-db.js';
import { computeRecipe, formatNumber } from '/src/recipe-compute.js';
import { normalizeRecipeUnit, recipeUnitSelectHtml } from '/src/recipe-units.js';
import {
  parsePastedIngredients,
  parsePastedBarceloBlock,
  parseRecipeExcelFile,
  isValidPasteRow,
  normPasteAmount,
  normalizeExcelRecipeUnit,
} from '/src/recipe-import.js';
import { mountIngredientAutocomplete } from '/src/ingredient-autocomplete.js';
import { applyRoleGates, requireCan } from '/src/permissions.js';
import { cartaIcon } from '/src/carta-icon.js';
import { canAddRecipes, planLimitMessageKey } from '/src/plan-limits.js';
import { syncRecipeMenus, menusContainingDish } from '/src/menu-structure.js';
import { archiveDeletedRecipe } from '/src/recipe-presets-api.js';
import { loadIngredientRegistry } from '/src/ingredient-registry.js';

// ============================================================
// 1. Mount sidebar shell + get workspace context
// ============================================================
const main = document.createElement('main');
main.id = 'main';
main.className = 'studio-page';

const ctx = await mountStudioShell({ active: 'recipes', main });
if (!ctx) {
  // mountStudioShell already redirected
} else {
const wsId = ctx.workspace.id;
const wsPlan = ctx.workspace.plan;
const orgId = ctx.workspace.organization_id ?? null;
const { role } = ctx;

let pantryIngredientNames = [];
let pantryNamesLoaded = false;
let ingredientRegistry = null;

async function ensureIngredientRegistry() {
  if (!ingredientRegistry) {
    const { registry } = await loadIngredientRegistry(supabase, wsId);
    ingredientRegistry = registry;
  }
  return ingredientRegistry;
}

function computeRecipeWs(recipe) {
  return computeRecipe(recipe, ingredientRegistry ? { registry: ingredientRegistry } : {});
}

async function loadPantryNames() {
  if (pantryNamesLoaded) return pantryIngredientNames;
  pantryNamesLoaded = true;
  const { data } = await supabase
    .from('cost_db')
    .select('ingredient_name')
    .eq('workspace_id', wsId);
  pantryIngredientNames = [...new Set((data || []).map((r) => r.ingredient_name).filter(Boolean))];
  return pantryIngredientNames;
}

function localRecipes() {
  return allRecipes.filter(r => r.workspace_id === wsId);
}
function localRecipeCount() {
  return localRecipes().length;
}

// ============================================================
// 2. Build top + grid markup
// ============================================================
main.innerHTML = `
  <div class="page-head">
    <div class="page-head__title">
      <span class="eyebrow eyebrow-accent" data-i18n="recipes.title">Recipe</span>
      <h1 class="h1">
        <span data-i18n="recipes.title">Recipe</span>
        <em data-i18n="recipes.title_em">library</em>.
      </h1>
      <p class="lead" data-i18n="recipes.intro">Build, edit, compute. Codex-compliant kcal, macros, allergens.</p>
    </div>
    <div class="page-head__actions">
      ${cartaIcon('search', { size: 20, style: 'color:var(--outline)' })}
      <label class="visually-hidden" for="searchInput" data-i18n="recipes.search_ph">Search recipes…</label>
      <input id="searchInput" type="search" placeholder="" data-i18n-ph="recipes.search_ph" autocomplete="off">
      <span class="divider" aria-hidden="true"></span>
      <button class="btn btn-primary btn-sm" id="newBtn" data-require="recipe_create">
        ${cartaIcon('add', { size: 18 })}
        <span data-i18n="recipes.new">New recipe</span>
      </button>
      <button type="button" class="btn btn-outline btn-sm" id="importJsonBtn" data-require="recipe_create" aria-label="">
        ${cartaIcon('upload_file', { size: 18 })}
        <span data-i18n="recipes.import_json">Import JSON</span>
      </button>
      <button type="button" class="btn btn-outline btn-sm" id="importExcelBtn" data-require="recipe_create">
        ${cartaIcon('upload_file', { size: 18 })}
        <span data-i18n="recipes.import_excel">Import Excel</span>
      </button>
      <input type="file" id="recipeJsonFile" accept=".json,application/json" hidden>
      <input type="file" id="recipeExcelFile" accept=".xlsx,.xls,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>
  </div>

  <div class="studio-panel-visual">
    <figure class="studio-panel-visual__cell" style="--ar-w:824; --ar-h:1024;"><img class="is-brand-visual" src="/assets/carta-editorial-breakfast.png" alt="Breakfast table with bread, preserves, butter, and porcelain." data-i18n-alt="img.alt.breakfast_spread" width="824" height="1024" loading="lazy" decoding="async"></figure>
  </div>

  <div id="listOrEmpty"></div>
`;

applyTranslations();
// Translate placeholder explicitly
const placeholderEl = main.querySelector('[data-i18n-ph]');
if (placeholderEl) placeholderEl.placeholder = t(placeholderEl.getAttribute('data-i18n-ph'));
applyRoleGates(role, main);

// ============================================================
// 3. Load recipes from Supabase
// ============================================================
let allRecipes = [];
let menuClusters = [];
let orgSiblingWorkspaceIds = null;

async function getOrgSiblingWorkspaceIds() {
  if (!orgId) return [];
  if (orgSiblingWorkspaceIds) return orgSiblingWorkspaceIds;
  const { data, error } = await supabase
    .from('workspaces')
    .select('id')
    .eq('organization_id', orgId)
    .neq('id', wsId);
  if (error) {
    console.warn('loadRecipes org workspaces', error);
    orgSiblingWorkspaceIds = [];
    return [];
  }
  orgSiblingWorkspaceIds = (data || []).map((w) => w.id);
  return orgSiblingWorkspaceIds;
}

async function loadMenuClusters() {
  const { data, error } = await supabase.from('menu_clusters').select('id,name,dishes').eq('workspace_id', wsId).order('name');
  if (error) {
    console.warn('loadMenuClusters', error);
    menuClusters = [];
    return;
  }
  menuClusters = data || [];
}

async function loadRecipes() {
  await ensureIngredientRegistry();
  const { data: localRows, error } = await supabase
    .from('saved_dishes')
    .select('*')
    .eq('workspace_id', wsId)
    .order('updated_at', { ascending: false });
  if (error) {
    console.error('loadRecipes', error);
    main.querySelector('#listOrEmpty').innerHTML = `<p class="flash error" style="max-width:600px;margin:var(--sp-6) auto">${error.message}</p>`;
    return;
  }
  let merged = [...(localRows || [])];
  if (orgId) {
    const siblingIds = await getOrgSiblingWorkspaceIds();
    if (siblingIds.length) {
      const { data: sharedRows, error: shareErr } = await supabase
        .from('saved_dishes')
        .select('*')
        .eq('share_with_org', true)
        .not('share_consent_at', 'is', null)
        .in('workspace_id', siblingIds)
        .order('updated_at', { ascending: false });
      if (shareErr) console.warn('loadRecipes org shared', shareErr);
      else merged = merged.concat(sharedRows || []);
    }
  }
  merged.sort((a, b) => {
    const ta = new Date(a.updated_at || 0).getTime();
    const tb = new Date(b.updated_at || 0).getTime();
    return tb - ta;
  });
  allRecipes = merged;
  render();
}

function render(filter = '') {
  const container = main.querySelector('#listOrEmpty');
  const cl = getLang();

  let items = allRecipes;
  if (filter) {
    const q = filter.toLowerCase();
    items = items.filter(r => (r.name || '').toLowerCase().includes(q));
  }

  if (localRecipeCount() === 0 && allRecipes.length === 0) {
    container.innerHTML = renderEmpty();
    main.querySelector('#emptyNewBtn').addEventListener('click', () => openEditor(null));
    const emptyImp = main.querySelector('#emptyImportJsonBtn');
    const emptyFile = main.querySelector('#recipeJsonFile');

      });
    }
    applyTranslations();
    applyRoleGates(role, container);
    return;

  if (items.length === 0) {
    container.innerHTML = `<p class="text-muted" style="text-align:center;margin:var(--sp-9) auto;max-width:400px" data-i18n="recipes.no_results">${escapeHTML(t('recipes.no_results'))}</p>`;
    applyTranslations();
    applyRoleGates(role, container);
    return;
  }

  container.innerHTML = `<div class="recipes-grid">${items.map(r => renderCard(r, cl)).join('')}</div>`;

}

function readIngredients(wrap) {
  return [...wrap.querySelectorAll('.ing-row')].map(row => {

    };
    if (brand) item.brand = brand;

}

function escapeHTML(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const normalizePasteUnit = normalizeExcelRecipeUnit;

function parsePasteText(text) {
  const raw = String(text || '');
  if (/\bingredients\b/i.test(raw) || (raw.includes('\t') && /\b(kg|pce|adet|litre)\b/i.test(raw))) {
    return parsePastedBarceloBlock(raw);
  }
  return parsePastedIngredients(raw);
}

function recipesArrayFromParsed(parsed) {
  if (parsed == null) return [];
  if (Array.isArray(parsed)) return parsed;
  if (typeof parsed !== 'object') return [];
  for (const key of ['recipes', 'dishes', 'items', 'data']) {
    if (Array.isArray(parsed[key])) return parsed[key];
  }
  if (parsed.recipe && typeof parsed.recipe === 'object') return [parsed.recipe];
  return [];
}

function normalizeImportedRecipe(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const name = String(raw.name || '').trim();
  if (!name) return null;
  const kind = raw.kind === 'drink' ? 'drink' : 'food';
  let blob = raw.data;
  if (!blob || typeof blob !== 'object') {
    blob = {
      servings: raw.servings,
      ingredients: raw.ingredients,
      menu_price: raw.menu_price,
    };
  }
  const servings = Math.max(1, parseInt(String(blob.servings ?? 1), 10) || 1);
  const ingSrc = Array.isArray(blob.ingredients) ? blob.ingredients : [];
  const ingredients = [];
  for (const ing of ingSrc) {
    if (!ing || typeof ing !== 'object') continue;
    const nm = String(ing.name || '').trim();
    if (!nm) continue;
    const row = {
      name: nm,
      amount: String(ing.amount ?? ing.qty ?? '').trim(),
      unit: normalizePasteUnit(ing.unit || ing.u || 'g'),
    };
    if (isValidPasteRow(row)) ingredients.push(row);
  }
  if (!ingredients.length) return null;
  const computed = computeRecipeWs({ ingredients, servings });
  const { ingredients: _ing, servings: _srv, computed: _cmp, ...rest } = blob;
  const data = { ...rest, servings, ingredients, computed };
  return { name, kind, data };
}

async function insertImportedRecipes(normalized, doneKey = 'recipes.import_json_done') {
  if (!normalized.length) {
    alert(t('recipes.import_json_err_empty'));
    return;
  }
  let skipped = 0;
  const pending = [];
  for (const row of normalized) {
    if (localRecipes().some(r => r.name === row.name && r.kind === row.kind)) {
      skipped++;
      continue;
    }
    pending.push(row);
  }
  if (!pending.length) {
    alert(t(doneKey).replace('{n}', '0').replace('{s}', String(skipped)));
    return;
  }
  const q = canAddRecipes(wsPlan, localRecipeCount(), pending.length);
  if (!q.ok) {
    alert(t('plan.err_recipe_limit'));
    return;
  }
  let n = 0;
  for (const row of pending) {
    const { error } = await supabase.from('saved_dishes').insert({
      workspace_id: wsId,
      name: row.name,
      kind: row.kind,
      data: row.data,
    });
    if (error) {
      console.warn('recipe import', row.name, error);
      const pk = planLimitMessageKey(error);
      if (pk) {
        alert(t(pk));
        break;
      }
      skipped++;
    } else {
      n++;
    }
  }
  await loadRecipes();
  alert(t(doneKey).replace('{n}', String(n)).replace('{s}', String(skipped)));
}

async function runRecipeJsonImport(file) {
  let parsed;
  try {
    parsed = JSON.parse(await file.text());
  } catch {
    alert(t('recipes.import_json_err_parse'));
    return;
  }
  const arr = recipesArrayFromParsed(parsed);
  const normalized = arr.map(normalizeImportedRecipe).filter(Boolean);
  await insertImportedRecipes(normalized);
}

async function runRecipeExcelImport(file) {
  const { recipes, warnings } = await parseRecipeExcelFile(file);
  if (warnings.includes('xlsx_load_failed')) {
    alert(t('recipes.import_excel_err_xlsx'));
    return;
  }
  if (warnings.includes('unsupported_file')) {
    alert(t('recipes.import_excel_err_file'));
    return;
  }
  const normalized = recipes.map((r) => normalizeImportedRecipe(r)).filter(Boolean);
  if (!normalized.length) {
    alert(t('recipes.import_excel_err_empty'));
    return;
  }
  await insertImportedRecipes(normalized, 'recipes.import_excel_done');
}

function applyParsedIngredientsToList(ingList, valid, editAction, gateRole, replace) {
  if (replace) ingList.innerHTML = '';
  for (const r of valid) {
    const row = buildIngRow({
      name: r.name.trim(),
      amount: normPasteAmount(r.amount),
      unit: normalizePasteUnit(r.unit),
    }, editAction);
    ingList.appendChild(row);
    applyRoleGates(gateRole, row);
  }
}

function toTitleTrWords(str) {
  return String(str || '').trim().split(/\s+/).filter(Boolean).map(word => {
    const lower = word.toLocaleLowerCase('tr-TR');
    return lower.charAt(0).toLocaleUpperCase('tr-TR') + lower.slice(1);
  }).join(' ');
}

function englishTitleFromKey(key) {
  return toTitleTrWords(String(key || '').replace(/\s*\([^)]*\)/g, '').trim());
}

function suggestRecipeNameFromForm(wrap) {
  const ings = readIngredients(wrap);
  if (!ings.length) return '';
  const lang = getLang();
  const take = ings.slice(0, 3);
  const parts = take.map(i => {
    const hit = lookupNutrient(i.name);
    const key = hit?.key || i.name.trim();
    if (lang === 'tr' || lang === 'en' || lang === 'es') {
      return ingredientLabel(key, lang);
    }
    return toTitleTrWords(i.name.trim());
  });
  return parts.join(' · ');
}

async function openEditor(recipe) {
  await loadPantryNames();
  currentRecipe = recipe;
  const data = recipe?.data || { servings: 1, ingredients: [{ name:'', amount:'', unit:'g' }] };
  if (!data.ingredients?.length) data.ingredients = [{ name:'', amount:'', unit:'g' }];

  const editor = buildEditorEl({ recipe, data });
  document.body.appendChild(editor);
  // Trap focus + Escape
  const onKey = (e) => {
    if (e.key === 'Escape') closeEditor();
  };
  document.addEventListener('keydown', onKey);
  editor._cleanup = () => document.removeEventListener('keydown', onKey);

  // Focus first field
  setTimeout(() => editor.querySelector('#editName')?.focus(), 50);
}

    let html = '';
    if (format && format !== 'plain') {
      html += `<p class="text-muted" style="margin:8px 10px;font-size:var(--type-caption)">${escapeHTML(t('recipes.paste_format_detected').replace('{f}', format))}</p>`;
    }
    html += '<table><thead><tr>';
    html += `<th>${escapeHTML(t('recipes.col_amount'))}</th>`;
    html += `<th>${escapeHTML(t('recipes.col_unit'))}</th>`;
    html += `<th>${escapeHTML(t('recipes.col_name'))}</th></tr></thead><tbody>`;
    for (const r of valid.slice(0, 40)) {
      html += `<tr><td>${escapeHTML(normPasteAmount(r.amount))}</td><td>${escapeHTML(normalizePasteUnit(r.unit))}</td><td>${escapeHTML(r.name)}</td></tr>`;
    }
    html += '</tbody></table>';
    if (valid.length > 40) {
      const n = valid.length - 40;
      html += `<p class="text-muted" style="margin:8px 10px">${escapeHTML(t('recipes.paste_more').replace('{n}', String(n)))}</p>`;
    }
    pastePrev.innerHTML = html;
    if (warnings.length) {
      pastePrev.innerHTML += `<div class="paste-warn">${escapeHTML(t('recipes.paste_skipped'))}<ul style="margin:6px 0 0 18px">${warnings.slice(0, 8).map(w => `<li>${escapeHTML(w)}</li>`).join('')}</ul></div>`;
    }
    applyTranslations();
  }

  wrap.querySelector('#pastePreviewBtn').addEventListener('click', runPastePreview);
  pasteTa.addEventListener('paste', () => { setTimeout(runPastePreview, 0); });

  wrap.querySelector('#pasteApplyBtn').addEventListener('click', () => {
    const { rows, warnings } = parsePasteText(pasteTa.value);
    const valid = rows.filter(isValidPasteRow);
    if (!valid.length) {
      alert(warnings.length ? t('recipes.paste_none_warn') : t('recipes.paste_none'));
      return;
    }
    applyParsedIngredientsToList(ingList, valid, editAction, gateRole, wrap.querySelector('#pasteReplace').checked);
    pasteTa.value = '';
    pastePrev.hidden = true;
    pastePrev.innerHTML = '';
    wrap.querySelector('.modal__form').dispatchEvent(new Event('input', { bubbles: true }));
    recompute();
  });

  const pasteExcelBtn = wrap.querySelector('#pasteExcelBtn');
  if (pasteExcelBtn) {
    pasteExcelBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.xlsx,.xls,.xlsm';
      input.addEventListener('change', async () => {
        const f = input.files?.[0];
        if (!f) return;
        const { recipes, warnings } = await parseRecipeExcelFile(f);
        if (warnings.includes('xlsx_load_failed')) {
          alert(t('recipes.import_excel_err_xlsx'));
          return;
        }
        if (!recipes.length) {
          alert(t('recipes.import_excel_err_empty'));
          return;
        }
        let pick = recipes[0];
        if (recipes.length > 1) {
          const list = recipes.map((r, i) => `${i + 1}. ${r.name}`).join('\n');
          const ans = window.prompt(`${t('recipes.excel_pick_sheet')}\n${list}`, '1');
          if (ans == null) return;
          const idx = parseInt(ans, 10) - 1;
          if (idx >= 0 && idx < recipes.length) pick = recipes[idx];
        }
        const norm = normalizeImportedRecipe(pick);
        if (!norm?.data?.ingredients?.length) {
          alert(t('recipes.import_excel_err_empty'));
          return;
        }
        const nameEl = wrap.querySelector('#editName');
        if (nameEl && !nameEl.value.trim()) nameEl.value = pick.name;
        const srvEl = wrap.querySelector('#editServings');
        if (srvEl && norm.data.servings) srvEl.value = String(norm.data.servings);
        applyParsedIngredientsToList(
          ingList,
          norm.data.ingredients,
          editAction,
          gateRole,
          wrap.querySelector('#pasteReplace').checked,
        );
        wrap.querySelector('.modal__form').dispatchEvent(new Event('input', { bubbles: true }));
        recompute();
      });
      input.click();
    });
  }

  wrap.querySelector('#pasteClipboardBtn').addEventListener('click', async () => {
    try {
      const txt = await navigator.clipboard.readText();
      pasteTa.value = txt;
      runPastePreview();
    } catch {
      alert(t('recipes.paste_clipboard_denied'));
    }
  });

  const shareOrgCb = wrap.querySelector('#shareOrgCb');
  const shareConsentWrap = wrap.querySelector('#shareConsentWrap');
  const shareConsentCb = wrap.querySelector('#shareConsentCb');
  if (shareOrgCb && shareConsentWrap && shareConsentCb) {
    shareOrgCb.addEventListener('change', () => {
      if (shareOrgCb.checked) {
        shareConsentWrap.style.display = 'block';
      } else {
        shareConsentCb.checked = false;
        shareConsentWrap.style.display = 'none';
      }
    });
  }

  function buildSharePatch() {
    if (!orgId || !shareOrgCb || isForeignShared) return {};
    if (!shareOrgCb.checked) {
      if (recipe?.share_with_org || recipe?.share_consent_at) {
        return { share_with_org: false, share_consent_at: null, share_consent_by: null };
      }
      return {};
    }
    if (!shareConsentCb?.checked) return null;
    if (recipe?.share_consent_at) {
      return { share_with_org: true };
    }
    return {
      share_with_org: true,
      share_consent_at: new Date().toISOString(),
    };
  }

  async function runSave(closeAfter) {
    const name = wrap.querySelector('#editName').value.trim();
    if (!name) { wrap.querySelector('#editName').focus(); return; }
    const sharePatch = buildSharePatch();
    if (sharePatch === null) {
      alert(t('recipes.share_consent_required'));
      return;
    }
    const servings = Math.max(1, parseInt(wrap.querySelector('#editServings').value) || 1);
    const ingredients = readIngredients(wrap);
    const computed = computeRecipeWs({ ingredients, servings });
    const selectedMenuIds = isForeignShared
      ? []
      : [...wrap.querySelectorAll('#recipeMenuPicker input[type=checkbox]:checked')].map((el) => el.value);
    const data = { servings, ingredients, computed, menu_cluster_ids: selectedMenuIds };
    const saveBtn = wrap.querySelector('#saveBtn');
    const saveCloseBtn = wrap.querySelector('#saveCloseBtn');
    const btns = [saveBtn, saveCloseBtn].filter(Boolean);
    btns.forEach(b => { b.disabled = true; });
    try {
      if (recipe && recipe.id) {
        const { error } = await supabase
          .from('saved_dishes')
          .update({ name, kind: editorKind, data, ...sharePatch })
          .eq('id', recipe.id);
        if (error) throw error;
        if (!isForeignShared) {
          try {
            await syncRecipeMenus({
              supabase, workspaceId: wsId, dishId: recipe.id, kind: editorKind,
              selectedMenuIds, clusters: menuClusters,
            });
          } catch (syncErr) {
            console.warn('menu sync', syncErr);
            alert(t('recipes.menus_sync_failed'));
          }
        }
        await loadMenuClusters();
        await loadRecipes();
        if (closeAfter) closeEditor();
      } else {
        const q = canAddRecipes(wsPlan, localRecipeCount(), 1);
        if (!q.ok) {
          alert(t('plan.err_recipe_limit'));
          return;
        }
        const { data: saved, error } = await supabase
          .from('saved_dishes')
          .insert({ workspace_id: wsId, name, kind: editorKind, data, ...sharePatch })
          .select()
          .single();
        if (error) throw error;
        if (!isForeignShared) {
          try {
            await syncRecipeMenus({
              supabase, workspaceId: wsId, dishId: saved.id, kind: editorKind,
              selectedMenuIds, clusters: menuClusters,
            });
          } catch (syncErr) {
            console.warn('menu sync', syncErr);
            alert(t('recipes.menus_sync_failed'));
          }
        }
        await loadMenuClusters();
        await loadRecipes();
        if (closeAfter) {
          closeEditor();
        } else {
          closeEditor();
          openEditor(saved);
        }
      }
    } catch (err) {
      console.error('save', err);
      const pk = planLimitMessageKey(err);
      alert(pk ? t(pk) : ((err && err.message) || 'Save failed'));
    } finally {
      btns.forEach(b => { b.disabled = false; });
    }
  }

  // Close handlers
  wrap.querySelector('#editorClose').addEventListener('click', closeEditor);
  wrap.querySelector('#cancelBtn').addEventListener('click', closeEditor);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeEditor(); });

  // Save (stay open) & save and close
  wrap.querySelector('#saveBtn').addEventListener('click', () => runSave(false));
  wrap.querySelector('#saveCloseBtn').addEventListener('click', () => runSave(true));

  // Delete
  if (isEdit) {
    wrap.querySelector('#deleteBtn').addEventListener('click', async () => {
      if (!confirm(t('recipes.delete_confirm'))) return;
      const delName = wrap.querySelector('#editName').value.trim() || recipe.name;
      const servings = Math.max(1, parseInt(wrap.querySelector('#editServings').value) || 1);
      const ingredients = readIngredients(wrap);
      const computed = computeRecipeWs({ ingredients, servings });
      const arch = await archiveDeletedRecipe(supabase, wsId, {
        name: delName,
        kind: editorKind,
        data: { servings, ingredients, computed },
      });
      if (arch.tableMissing) {
        console.warn('My presets table not deployed — recipe not archived to presets');
      } else if (arch.error) {
        console.warn('archive preset', arch.error);
      }
      const { error } = await supabase.from('saved_dishes').delete().eq('id', recipe.id);
      if (error) { alert(error.message); return; }
      closeEditor();
      await loadRecipes();
    });

    // Duplicate — clones the recipe into a new row with " (copy)" suffix
    wrap.querySelector('#duplicateBtn').addEventListener('click', async () => {
      const dupBtn = wrap.querySelector('#duplicateBtn');
      const q = canAddRecipes(wsPlan, localRecipeCount(), 1);
      if (!q.ok) {
        alert(t('plan.err_recipe_limit'));
        return;
      }
      dupBtn.disabled = true;
      const newName = `${recipe.name} ${t('recipes.copy_suffix')}`;
      // Capture current form state (in case the user has edited but not saved)
      const servings = Math.max(1, parseInt(wrap.querySelector('#editServings').value) || 1);
      const ingredients = readIngredients(wrap);
      const computed = computeRecipeWs({ ingredients, servings });
      const newData = { servings, ingredients, computed };
      const { data, error } = await supabase
        .from('saved_dishes')
        .insert({ workspace_id: wsId, name: newName, kind: editorKind, data: newData })
        .select()
        .single();
      dupBtn.disabled = false;
      if (error) {
        const pk = planLimitMessageKey(error);
        alert(pk ? t(pk) : error.message);
        return;
      }
      closeEditor();
      await loadRecipes();
      // Open the new dish for immediate editing
      openEditor(data);
    });
  }

  // Wire compute on any input within form
  wrap.querySelector('.modal__form').addEventListener('input', () => recompute());

  function recompute() {
    const servings = Math.max(1, parseInt(wrap.querySelector('#editServings').value) || 1);
    const ings = readIngredients(wrap);
    const c = computeRecipeWs({ ingredients: ings, servings });
    wrap.querySelector('#prevKcal').textContent = formatNumber(c.perServing.kcal, 0);
    wrap.querySelector('#prevP').textContent  = formatNumber(c.perServing.P, 1) + ' g';
    wrap.querySelector('#prevF').textContent  = formatNumber(c.perServing.F, 1) + ' g';
    wrap.querySelector('#prevC').textContent  = formatNumber(c.perServing.C, 1) + ' g';
    wrap.querySelector('#prevFi').textContent = formatNumber(c.perServing.Fi, 1) + ' g';
    const cl = getLang();
    const allEl = wrap.querySelector('#prevAllergens');
    if (c.allergens.length) {
      allEl.innerHTML = c.allergens.map(a => `<span class="chip chip-gold" style="font-size:11px">${escapeHTML(ALLERGEN_LABELS[a]?.[cl] || a)}</span>`).join('');
    } else {
      allEl.innerHTML = `<span class="text-muted">${escapeHTML(t('recipes.allergens_none'))}</span>`;
    }
    const dietEl = wrap.querySelector('#prevDiet');
    if (c.dietTags.length) {
      dietEl.innerHTML = c.dietTags.map(d => `<span class="chip" style="font-size:11px">${escapeHTML(t('diet.'+d) || d)}</span>`).join('');
    } else {
      dietEl.innerHTML = `<span class="text-muted">${escapeHTML(t('recipes.diet_none'))}</span>`;
    }
  }

  // Translate any newly-rendered text
  applyTranslations();
  recompute();
  applyRoleGates(gateRole, wrap);
  return wrap;
}

function brandDatalistHtml(name) {
  if (!ingredientRegistry || !name) return '';
  const canonical = ingredientRegistry.canonicalKeyFor?.(name) || name;
  const brands = ingredientRegistry.listBrands?.(canonical) || [];
  if (!brands.length) return '';
  const id = `brand-list-${Math.random().toString(36).slice(2, 9)}`;
  const opts = brands.map((b) => `<option value="${escapeHTML(b.brand_name)}">`).join('');
  return `<datalist id="${id}">${opts}</datalist>`;
}

function syncIngBrandList(row) {
  const name = row.querySelector('.ing-name')?.value.trim() || '';
  const brandInput = row.querySelector('.ing-brand');
  if (!brandInput) return;
  row.querySelector('.col-brand datalist')?.remove();
  const html = brandDatalistHtml(name);
  if (html) {
    brandInput.insertAdjacentHTML('afterend', html);
    const id = html.match(/id="([^"]+)"/)?.[1];
    if (id) brandInput.setAttribute('list', id);
  } else {
    brandInput.removeAttribute('list');
  }
}

function buildIngRow(ing, editAction) {
  const row = document.createElement('div');
  row.className = 'ing-row';
  const brandList = brandDatalistHtml(ing.name || '');
  const brandListId = brandList.match(/id="([^"]+)"/)?.[1] || '';
  row.innerHTML = `
    <div class="col-name" style="position:relative">
      <input class="input ing-name" type="text" placeholder="${escapeHTML(t('recipes.col_name'))}" value="${escapeHTML(ing.name || '')}" autocomplete="off" autocapitalize="off" spellcheck="false" data-require-disable="${editAction}">
    </div>
    <div class="col-brand">
      <input class="input ing-brand" type="text" placeholder="${escapeHTML(t('recipes.col_brand'))}" value="${escapeHTML(ing.brand || '')}" ${brandListId ? `list="${brandListId}"` : ''} autocomplete="off" data-require-disable="${editAction}">
      ${brandList}
    </div>
    <div class="col-amount">
      <input class="input ing-amount" type="text" inputmode="decimal" placeholder="${escapeHTML(t('recipes.col_amount'))}" value="${ing.amount ?? ''}" data-require-disable="${editAction}">
    </div>
    <div class="col-unit">
      <select class="input ing-unit" aria-label="${escapeHTML(t('recipes.col_unit'))}" data-require-disable="${editAction}">
        ${recipeUnitSelectHtml(ing.unit, t)}
      </select>
    </div>
    <div class="col-rm">
      <button type="button" class="rm-btn" aria-label="Remove ingredient" data-require="${editAction}">
        ${cartaIcon('close', { size: 20 })}
      </button>
    </div>
  `;
  mountIngredientAutocomplete(row.querySelector('.ing-name'), {
    pantryNames: pantryIngredientNames,
    limit: 12,
    emptyMessage: t('recipes.no_match'),
  });
  const nameInput = row.querySelector('.ing-name');
  nameInput.addEventListener('change', () => syncIngBrandList(row));
  nameInput.addEventListener('blur', () => syncIngBrandList(row));
  row.querySelector('.rm-btn').addEventListener('click', () => {
    row.remove();
    document.getElementById('recipeEditor')?.querySelector('.modal__form')?.dispatchEvent(new Event('input', { bubbles: true }));
  });
  return row;
}


await loadMenuClusters();
await loadRecipes();
const vh = document.createElement('style');
vh.textContent = '.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}';
document.head.appendChild(vh);

const importJsonBtn = main.querySelector('#importJsonBtn');
const recipeJsonFile = main.querySelector('#recipeJsonFile');
const importExcelBtn = main.querySelector('#importExcelBtn');
const recipeExcelFile = main.querySelector('#recipeExcelFile');
if (importJsonBtn && recipeJsonFile) {
  importJsonBtn.setAttribute('aria-label', t('recipes.import_json_aria'));
  importJsonBtn.addEventListener('click', () => {
    if (!requireCan(role, 'recipe_create', t('recipes.import_denied'))) return;
    recipeJsonFile.click();
  });
  recipeJsonFile.addEventListener('change', async (ev) => {
    const f = ev.target.files?.[0];
    ev.target.value = '';
    if (!f) return;
    if (!requireCan(role, 'recipe_create', t('recipes.import_denied'))) return;
    await runRecipeJsonImport(f);
  });
}
if (importExcelBtn && recipeExcelFile) {
  importExcelBtn.addEventListener('click', () => {
    if (!requireCan(role, 'recipe_create', t('recipes.import_denied'))) return;
    recipeExcelFile.click();
  });
  recipeExcelFile.addEventListener('change', async (ev) => {
    const f = ev.target.files?.[0];
    ev.target.value = '';
    if (!f) return;
    if (!requireCan(role, 'recipe_create', t('recipes.import_denied'))) return;
    await runRecipeExcelImport(f);
  });
}
}
</script>
