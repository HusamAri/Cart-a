<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/scripts/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Activity log · Carta</title>
<meta name="theme-color" content="#1B2A22">
<meta name="description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:title" content="Activity log · Carta">
<meta property="og:description" content="Carta F&amp;B Operations Studio: recipes, cost, pricing, menus, and compliance in one workspace.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en">
<meta property="og:site_name" content="Carta">
<meta property="og:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Carta · F&amp;B Operations Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=7">
<link rel="icon" type="image/png" href="/assets/carta-favicon.png?v=7">
<link rel="apple-touch-icon" href="/assets/carta-apple-touch-icon.png?v=7">
<link rel="stylesheet" href="/styles/tokens.css">
<style>
  .studio-page { padding: var(--sp-7) var(--margin-desktop) var(--sp-10); flex: 1; overflow-y: auto; }
  @media (max-width: 900px) { .studio-page { padding: var(--sp-5) var(--margin-mobile) var(--sp-8); } }
  .page-head { max-width: 1080px; margin: 0 auto var(--sp-7); }
  .page-head .eyebrow { margin-bottom: var(--sp-3); }
  .page-head h1 { margin: 0 0 var(--sp-3); }
  .page-head .lead { margin: 0; max-width: 62ch; }

  .audit-toolbar {
    max-width: 1080px; margin: 0 auto var(--sp-5);
    display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: flex-end;
  }
  .audit-toolbar label { display: block; font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--on-surface-variant); margin-bottom: 4px; }
  .audit-toolbar select { min-width: 200px; padding: 10px 14px; border-radius: var(--r-lg); border: var(--glass-border); background: var(--surface-container-lowest); font-family: var(--font-sans); }

  .audit-card {
    max-width: 1080px; margin: 0 auto;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
    overflow: hidden;
  }
  .audit-card table { width: 100%; border-collapse: collapse; }
  .audit-card thead th {
    text-align: left;
    font-family: var(--font-sans); font-weight: 600;
    font-size: 11px; letter-spacing: var(--track-caps);
    text-transform: uppercase; color: var(--on-surface-variant);
    padding: 14px var(--sp-4);
    border-bottom: 1px solid var(--outline-variant);
    background: var(--surface-container-low);
  }
  .audit-card tbody td {
    padding: 12px var(--sp-4);
    border-bottom: 1px solid var(--outline-variant);
    font-family: var(--font-sans);
    font-size: var(--type-caption);
    vertical-align: top;
  }
  .audit-card tbody tr:last-child td { border-bottom: 0; }
  .col-when { font-family: var(--font-display); font-style: italic; color: var(--primary); white-space: nowrap; }
  .col-type code {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    background: rgb(var(--ink-rgb) / 0.06);
    padding: 2px 8px;
    border-radius: var(--r-pill);
  }
  .col-count { font-variant-numeric: tabular-nums; text-align: right; }
  .col-actor { font-family: ui-monospace, monospace; font-size: 11px; color: var(--on-surface-variant); }

  .audit-empty {
    max-width: 520px; margin: var(--sp-10) auto;
    text-align: center;
    padding: var(--sp-8);
    background: var(--surface-container-low);
    border-radius: var(--r-xl);
    border: var(--glass-border);
    box-shadow: var(--shadow-inner-glow), var(--shadow-1);
  }
</style>
</head>
<body>
<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<script type="module">
import { mountStudioShell } from '/src/studio-layout.js';
import { supabase } from '/src/supabase-client.js';
import { applyTranslations, t, getLang } from '/src/i18n.js';

const main = document.createElement('main');
main.id = 'main';
main.className = 'studio-page';

const ctx = await mountStudioShell({ active: 'audit', main });
if (!ctx) throw new Error('No session/workspace');
const ws = ctx.workspace;
const wsId = ws.id;

let allRows = [];
let typeFilter = '';

main.innerHTML = `
  <div class="page-head">
    <span class="eyebrow eyebrow-accent" data-i18n="activity.eyebrow">Compliance</span>
    <h1 class="h1"><em data-i18n="activity.title">Activity</em> <span data-i18n="activity.title_em">log</span></h1>
    <p class="lead" data-i18n="activity.intro">Workspace-scoped audit entries (type, note, quantity). Rows appear when upstream features write to the audit log.</p>
  </div>

  <div class="audit-toolbar">
    <div>
      <label for="auditTypeFilter" data-i18n="activity.filter_type">Event type</label>
      <select id="auditTypeFilter"></select>
    </div>
    <button type="button" class="btn btn-accent btn-sm" id="auditRefresh" data-i18n="activity.refresh">Refresh</button>
  </div>

  <div id="auditRoot"></div>
`;

applyTranslations();

function escapeHTML(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatWhen(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const loc = getLang() === 'tr' ? 'tr-TR' : undefined;
    return d.toLocaleString(loc, { dateStyle: 'medium', timeStyle: 'short' });
  } catch {
    return String(iso);
  }
}

function shortActor(uid) {
  if (!uid) return '—';
  const s = String(uid);
  return s.length > 12 ? `${s.slice(0, 8)}…` : s;
}

function fillTypeFilter(types) {
  const sel = main.querySelector('#auditTypeFilter');
  const preserve = typeFilter;
  sel.innerHTML =
    `<option value="">${escapeHTML(t('activity.filter_all'))}</option>` +
    types.map(ty => `<option value="${escapeHTML(ty)}">${escapeHTML(ty)}</option>`).join('');
  if (preserve && types.includes(preserve)) sel.value = preserve;
  else sel.value = '';
}

function render() {
  const root = main.querySelector('#auditRoot');
  const rows = typeFilter ? allRows.filter(r => r.type === typeFilter) : allRows;

  if (!allRows.length) {
    root.innerHTML = `
      <div class="audit-empty">
        <p class="lead" data-i18n="activity.empty">No audit events yet for this workspace.</p>
      </div>`;
    applyTranslations();
    return;
  }

  root.innerHTML = `
    <div class="audit-card">
      <table>
        <thead>
          <tr>
            <th data-i18n="activity.col_when">When</th>
            <th data-i18n="activity.col_type">Type</th>
            <th data-i18n="activity.col_note">Note</th>
            <th class="col-count" data-i18n="activity.col_count">Count</th>
            <th data-i18n="activity.col_actor">Actor</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td class="col-when">${escapeHTML(formatWhen(r.created_at))}</td>
              <td class="col-type"><code>${escapeHTML(r.type || '')}</code></td>
              <td>${r.note ? escapeHTML(r.note) : '<span class="text-muted">—</span>'}</td>
              <td class="col-count">${r.count != null ? escapeHTML(String(r.count)) : '—'}</td>
              <td class="col-actor">${escapeHTML(shortActor(r.user_id))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <p class="text-muted" style="max-width:1080px;margin:var(--sp-4) auto 0;font-size:var(--type-caption);text-align:center" data-i18n="activity.footer_hint">Newest first. Up to 500 rows loaded.</p>
  `;
  applyTranslations();
}

async function load() {
  const root = main.querySelector('#auditRoot');
  root.innerHTML = `<p class="text-muted" style="text-align:center">${escapeHTML(t('activity.loading'))}</p>`;
  const { data, error } = await supabase
    .from('audit_log')
    .select('*')
    .eq('workspace_id', wsId)
    .order('created_at', { ascending: false })
    .limit(500);
  if (error) {
    root.innerHTML = `<p class="flash error" style="max-width:640px;margin:0 auto">${escapeHTML(error.message)}</p>`;
    return;
  }
  allRows = data || [];
  const types = [...new Set(allRows.map(r => r.type).filter(Boolean))].sort();
  fillTypeFilter(types);
  render();
}

main.querySelector('#auditTypeFilter').addEventListener('change', (e) => {
  typeFilter = (e.target.value || '').trim();
  render();
});
main.querySelector('#auditRefresh').addEventListener('click', () => load());

await load();

document.getElementById('sidebarLangBtn')?.addEventListener('click', () => {
  setTimeout(() => {
    const types = [...new Set(allRows.map(r => r.type).filter(Boolean))].sort();
    fillTypeFilter(types);
    render();
    applyTranslations();
  }, 0);
});
</script>
</body>
</html>
