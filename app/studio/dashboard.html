<style>
  .studio-page { padding: var(--sp-7) var(--margin-desktop) var(--sp-10); flex: 1; overflow-y: auto; }
  @media (max-width: 900px) { .studio-page { padding: var(--sp-5) var(--margin-mobile) var(--sp-8); } }
  .page-head { max-width: 1120px; margin: 0 auto var(--sp-7); }
  .page-head .eyebrow { margin-bottom: var(--sp-3); }
  .page-head h1 { margin: 0 0 var(--sp-3); }
  .page-head .lead { margin: 0 0 var(--sp-3); max-width: 62ch; }
  .dash-disclaimer {
    margin: 0 0 var(--sp-5);
    max-width: 68ch;
    padding: var(--sp-4) var(--sp-5);
    border-radius: var(--r-lg);
    border: 1px solid rgba(201, 132, 18, 0.28);
    background: rgb(var(--honey-mist-rgb) / 0.14);
    font-size: var(--type-caption);
    line-height: 1.55;
    color: var(--on-surface-variant);
  }

  .dash-toolbar {
    display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: flex-end; margin-bottom: var(--sp-7);
    max-width: 1120px; margin-left: auto; margin-right: auto;
  }
  .dash-toolbar label { display: block; font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--on-surface-variant); margin-bottom: 4px; }
  .dash-toolbar select { min-width: 220px; padding: 10px 14px; border-radius: var(--r-lg); border: var(--glass-border); background: var(--surface-container-lowest); font-family: var(--font-sans); }
  .dash-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-left: auto; }

  .dash-grid {
    max-width: 1120px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-5);
  }
  @media (max-width: 800px) { .dash-grid { grid-template-columns: 1fr; } }

  .dash-card {
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-2xl);
    box-shadow: var(--shadow-2);
    padding: var(--glass-padding);
  }
  .dash-card--viz {
    animation: dashCardIn 0.52s var(--ease) both;
  }
  .dash-card--viz:nth-child(1) { animation-delay: 0.02s; }
  .dash-card--viz:nth-child(2) { animation-delay: 0.08s; }
  .dash-card--viz:nth-child(3) { animation-delay: 0.14s; }
  .dash-card--viz:nth-child(4) { animation-delay: 0.2s; }
  .dash-card--viz:nth-child(5) { animation-delay: 0.26s; }
  .dash-card--viz:nth-child(6) { animation-delay: 0.32s; }
  .dash-card--viz:nth-child(7) { animation-delay: 0.38s; }
  .dash-card--viz:nth-child(8) { animation-delay: 0.42s; }
  @keyframes dashCardIn {
    from { transform: translateY(10px); }
    to { transform: none; }
  }
  .dash-card--viz { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .dash-card--viz { animation: none !important; opacity: 1 !important; transform: none !important; }
    .dash-macro-seg,
    .dash-bar-fill,
    .dash-kpi { animation: none !important; transition: none !important; }
    .dash-macro-seg,
    .dash-bar-fill { transform: scaleX(1) !important; }
    .dash-kpi { transform: none !important; opacity: 1 !important; }
    .dash-card--warn { animation: none !important; box-shadow: 0 0 0 1px rgba(201, 132, 18, 0.1), var(--shadow-2) !important; }
  }

  .dash-card--warn {
    border-color: rgba(201, 132, 18, 0.38);
    box-shadow: 0 0 0 1px rgba(201, 132, 18, 0.1), var(--shadow-2);
    animation: dashWarnPulse 2.4s var(--ease) 1;
  }
  @keyframes dashWarnPulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(201, 132, 18, 0.1), var(--shadow-2); }
    40% { box-shadow: 0 0 0 4px rgba(201, 132, 18, 0.14), var(--shadow-2); }
  }

  .dash-card__head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-3);
    margin-bottom: var(--sp-4);
  }
  .dash-card__head h2 {
    font-family: var(--font-display); font-weight: 400; font-style: italic; font-size: 1.35rem; color: var(--primary);
    margin: 0;
    flex: 1 1 12rem;
  }
  .dash-calc { flex: 0 1 14rem; max-width: 100%; margin: 0; }
  .dash-calc-summary {
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: var(--r-pill);
    border: 1px solid rgb(var(--ink-rgb) / 0.12);
    background: rgba(255, 255, 255, 0.72);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: var(--track-caps);
    text-transform: uppercase;
    color: var(--on-surface-variant);
    transition: border-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
  }
  .dash-calc-summary::-webkit-details-marker { display: none; }
  .dash-calc-summary:hover { border-color: var(--outline-variant); color: var(--primary); background: rgba(223, 228, 221, 0.35); }
  .dash-calc-summary:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  .dash-calc-summary__ic { display: flex; color: var(--outline); flex-shrink: 0; }
  .dash-calc-body {
    margin-top: var(--sp-3);
    padding: var(--sp-4);
    border-radius: var(--r-lg);
    background: rgb(var(--ink-rgb) / 0.04);
    border: 1px solid rgb(var(--ink-rgb) / 0.07);
    font-size: var(--type-caption);
    line-height: 1.58;
    color: var(--on-surface-variant);
  }
  .dash-calc-body p { margin: 0; }

  .dash-card h3 {
    font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant); margin: 0 0 var(--sp-3);
  }
  .dash-kpis {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3);
  }
  .dash-kpis--co2 { grid-template-columns: repeat(2, 1fr); max-width: 100%; }
  @media (max-width: 700px) { .dash-kpis--co2 { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .dash-kpis { grid-template-columns: repeat(2, 1fr); } }
  .dash-kpi {
    padding: var(--sp-4); background: rgb(var(--ink-rgb) / 0.04); border-radius: var(--r-lg); text-align: center;
    animation: dashKpiIn 0.55s var(--ease) both;
  }
  .dash-kpi:nth-child(1) { animation-delay: 0.08s; }
  .dash-kpi:nth-child(2) { animation-delay: 0.14s; }
  .dash-kpi:nth-child(3) { animation-delay: 0.2s; }
  .dash-kpi:nth-child(4) { animation-delay: 0.26s; }
  @keyframes dashKpiIn {
    from { transform: translateY(6px); }
    to { transform: none; }
  }
  .dash-kpi .num { font-family: var(--font-display); font-size: 1.75rem; font-weight: 300; color: var(--primary); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .dash-kpi .lbl { font-size: 10px; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--on-surface-variant); margin-top: 4px; }

  .dash-macro-bar {
    height: 12px; border-radius: var(--r-pill); overflow: hidden; display: flex; margin-top: var(--sp-3);
  }
  .dash-macro-seg {
    height: 100%;
    transform: scaleX(1);
    transform-origin: left center;
    animation: dashMacroSeg 0.85s var(--ease) forwards;
  }
  .dash-macro-seg--p { animation-delay: 0.06s; }
  .dash-macro-seg--c { animation-delay: 0.16s; }
  .dash-macro-seg--f { animation-delay: 0.26s; }
  @keyframes dashMacroSeg {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .dash-macro-legend { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-top: var(--sp-3); font-size: var(--type-caption); }
  .dash-macro-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }

  .dash-row { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: 8px; font-size: var(--type-caption); min-height: 1.25rem; }
  .dash-row .bar-wrap { flex: 1; min-width: 0; height: 8px; background: rgb(var(--ink-rgb) / 0.08); border-radius: var(--r-pill); overflow: hidden; }
  .dash-bar-fill {
    height: 100%;
    width: var(--bar-w, 0%);
    background: var(--primary);
    border-radius: var(--r-pill);
    transform: scaleX(1);
    transform-origin: left center;
    animation: dashBarGrow 0.72s var(--ease) forwards;
  }
  @keyframes dashBarGrow {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .dash-loading {
    text-align: center;
    padding: var(--sp-10) var(--sp-5);
    color: var(--on-surface-variant);
    font-size: var(--type-caption);
  }
  .dash-row .pct { min-width: 48px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  .dash-links {
    display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4);
  }

  .dash-gaps ul { margin: 0; padding-left: 1.2rem; font-size: var(--type-caption); line-height: 1.6; }
  .dash-empty { text-align: center; padding: var(--sp-10) var(--sp-5); max-width: 480px; margin: 0 auto; }
  @media print {
    .dash-toolbar .dash-actions, .sidebar, .studio-mobile-top, .skip-link { display: none !important; }
    .dash-calc-body { display: block !important; }
    .dash-card--viz, .dash-kpi, .dash-macro-seg, .dash-bar-fill { animation: none !important; transform: none !important; opacity: 1 !important; }
    .dash-macro-seg { transform: scaleX(1) !important; }
    .dash-bar-fill { transform: scaleX(1) !important; }
  }
</style>

<body>
<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<script type="module">
import { mountStudioShell } from '/src/studio-layout.js';
import { supabase } from '/src/supabase-client.js';
import { applyTranslations, t, getLang } from '/src/i18n.js';
import { computeRecipe, formatNumber, computeDishCost, buildCostMap, computeRecipeClimate, toGrams } from '/src/recipe-compute.js';
import { clusterDishIds } from '/src/menu-structure.js';
import { emissionIntensityKgCo2ePerKg } from '/src/carbon-factors.js';
import { ALLERGEN_LABELS } from '/src/nutrient-db.js';
import { loadIngredientRegistry } from '/src/ingredient-registry.js';
import { applyRoleGates } from '/src/permissions.js';
import { cartaIcon } from '/src/carta-icon.js';

const main = document.createElement('main');
main.id = 'main';
main.className = 'studio-page';

const ctx = await mountStudioShell({ active: 'dashboard', main });
if (!ctx) {
  // mountStudioShell already redirected
} else {
const ws = ctx.workspace;
const wsId = ws.id;
const qFactor = Number(ws.q_factor) || 3;
const { role } = ctx;

let allDishes = [];
let clusters = [];
let clusterFilter = '__all__';
let lastCostMap = buildCostMap([]);
let ingredientRegistry = null;

main.innerHTML = `
  <div class="page-head">
    <span class="eyebrow eyebrow-accent" data-i18n="dash.page_eyebrow">Menu intelligence</span>
    <h1 class="h1"><span data-i18n="dash.page_title">Kitchen</span> <em data-i18n="dash.page_title_em">dashboard</em></h1>
    <p class="lead" data-i18n="dash.page_intro">Workspace-wide signals from saved recipes: nutrition mix, allergens, diet coverage, a greenhouse-gas proxy, and cost completeness.</p>
    <p class="dash-disclaimer" data-i18n="dash.disclaimer" role="note"></p>
  </div>

  <div class="studio-panel-visual">
    <figure class="studio-panel-visual__cell" style="--ar-w:824; --ar-h:1024;"><img class="is-brand-visual" src="/assets/carta-hero-kitchen.png" alt="Bright hotel kitchen during service prep; chefs working at polished stations." data-i18n-alt="img.alt.kitchen_operational" width="824" height="1024" loading="lazy" decoding="async"></figure>
  </div>

  <div class="dash-toolbar">
    <div>
      <label for="dashCluster" data-i18n="dash.scope_label">Scope</label>
      <select id="dashCluster"></select>
    </div>
    <div class="dash-actions">
      <button type="button" class="btn btn-accent btn-sm" id="dashRefresh" data-i18n="dash.refresh">Refresh</button>
      <button type="button" class="btn btn-outline btn-sm" id="dashCsv" data-require="export" data-i18n="dash.export_csv">Export CSV</button>
      <button type="button" class="btn btn-outline btn-sm" id="dashPrint" data-require="export" data-i18n="dash.print">Print</button>
    </div>
  </div>

  <div id="dashRoot" class="dash-loading" aria-busy="true" data-i18n="dash.loading">Loading dashboard…</div>
`;

applyTranslations();
applyRoleGates(role, main);

function showDashLoading() {
  const root = main.querySelector('#dashRoot');
  if (!root) return;
  root.className = 'dash-loading';
  root.setAttribute('aria-busy', 'true');
  root.innerHTML = escapeHTML(t('dash.loading'));
  root.dataset.i18n = 'dash.loading';
}

function showDashError(message) {
  const root = main.querySelector('#dashRoot');
  if (!root) return;
  root.className = '';
  root.removeAttribute('aria-busy');
  root.innerHTML = `<p class="flash error">${escapeHTML(message)}</p>`;
}

/** If entrance animations never run, KPI tiles and bars must not stay invisible. */
function ensureDashVisible() {
  const root = main.querySelector('#dashRoot');
  if (!root) return;
  requestAnimationFrame(() => {
    root.querySelectorAll('.dash-kpi, .dash-card--viz').forEach((el) => {
      if (parseFloat(getComputedStyle(el).opacity) < 0.05) {
        el.style.opacity = '1';
        el.style.transform = 'none';
      }
    });
    root.querySelectorAll('.dash-macro-seg, .dash-bar-fill').forEach((el) => {
      const tr = getComputedStyle(el).transform;
      if (tr && tr !== 'none' && (tr.includes('matrix(0') || tr.includes('scale(0'))) {
        el.style.transform = 'scaleX(1)';
      }
    });
  });
}

async function load() {
  showDashLoading();
  try {
    const reg = await loadIngredientRegistry(supabase, wsId);
    ingredientRegistry = reg.registry;
    const [dRes, cRes, clRes] = await Promise.all([
      supabase.from('saved_dishes').select('*').eq('workspace_id', wsId).order('updated_at', { ascending: false }),
      supabase.from('cost_db').select('*').eq('workspace_id', wsId),
      supabase.from('menu_clusters').select('*').eq('workspace_id', wsId).order('name'),
    ]);
    if (dRes.error) {
      showDashError(dRes.error.message);
      return;
    }
    allDishes = dRes.data || [];
    const costMap = buildCostMap(cRes.data || []);
    lastCostMap = costMap;
    clusters = clRes.data || [];
    fillClusterSelect();
    renderDash(costMap);
    applyTranslations();
    applyRoleGates(role, main);
    ensureDashVisible();
  } catch (err) {
    console.error('[dashboard]', err);
    showDashError(err?.message || String(err));
  }
}

function fillClusterSelect() {
  const sel = main.querySelector('#dashCluster');
  const lang = getLang();
  sel.innerHTML = `<option value="__all__">${escapeHTML(t('dash.scope_all'))}</option>` +
    clusters.map(cl => `<option value="${escapeHTML(cl.id)}">${escapeHTML(cl.name)}</option>`).join('');
  sel.value = clusterFilter;
  sel.onchange = () => { clusterFilter = sel.value; void load(); };
}

function clusterDishSet(clusterId) {
  if (clusterId === '__all__') return null;
  const cl = clusters.find((x) => x.id === clusterId);
  if (!cl) return new Set();
  return new Set(clusterDishIds(cl));
}

function scopedDishes() {
  const idSet = clusterDishSet(clusterFilter);
  if (idSet === null) return allDishes;
  return allDishes.filter(d => idSet.has(d.id));
}

function allergenLabel(key, lang) {
  const L = ALLERGEN_LABELS[key];
  if (!L) return key;
  return lang === 'tr' ? L.tr : L.en;
}

function analyze(rows, costMap) {
  const lang = getLang();
  const items = rows.map(r => {
    const data = r.data || {};
    const comp = computeRecipe(
      { ingredients: data.ingredients || [], servings: data.servings || 1 },
      ingredientRegistry ? { registry: ingredientRegistry } : {},
    );
    const cost = computeDishCost(data, costMap, qFactor);
    return { row: r, comp, cost };
  });
  const n = items.length;
  if (n === 0) return { empty: true };

  let sumKcal = 0, sumP = 0, sumF = 0, sumC = 0;
  const allergenRecipeCount = {};
  const dietCounts = { vegan: 0, vegetarian: 0, halal: 0, gluten_free: 0 };
  const kcalBuckets = { low: 0, mid: 0, high: 0, vhigh: 0 };
  const ingCount = {};
  let foodN = 0, drinkN = 0;
  let costFull = 0, costPartial = 0, costNone = 0;
  let sumGco2 = 0;
  let sumCo2PerKcal = 0;
  let co2KcalN = 0;
  const emitByIng = {};
  const perDishCo2 = [];

  for (const { row, comp, cost } of items) {
    if (row.kind === 'drink') drinkN++; else foodN++;
    const k = comp?.perServing?.kcal || 0;
    sumKcal += k;
    sumP += comp?.perServing?.P || 0;
    sumF += comp?.perServing?.F || 0;
    sumC += comp?.perServing?.C || 0;
    for (const a of comp.allergens || []) {
      allergenRecipeCount[a] = (allergenRecipeCount[a] || 0) + 1;
    }
    for (const d of comp.dietTags || []) {
      if (Object.prototype.hasOwnProperty.call(dietCounts, d)) dietCounts[d]++;
    }
    if (k < 300) kcalBuckets.low++;
    else if (k < 500) kcalBuckets.mid++;
    else if (k < 700) kcalBuckets.high++;
    else kcalBuckets.vhigh++;
    for (const i of (row.data?.ingredients || [])) {
      const nm = (i.name || '').trim();
      if (nm) ingCount[nm] = (ingCount[nm] || 0) + 1;
    }
    const nIng = (row.data?.ingredients || []).length;
    const miss = cost.missing.length;
    if (nIng === 0) costNone++;
    else if (miss === 0) costFull++;
    else if (miss < nIng) costPartial++;
    else costNone++;

    const data = row.data || {};
    const climate = computeRecipeClimate({ ingredients: data.ingredients || [], servings: data.servings || 1 });
    sumGco2 += climate.perServingGCo2e;
    const kcalP = comp?.perServing?.kcal || 0;
    if (kcalP >= 40) {
      sumCo2PerKcal += climate.perServingGCo2e / kcalP;
      co2KcalN++;
    }
    perDishCo2.push({ name: row.name || '—', g: climate.perServingGCo2e });
    for (const i of (data.ingredients || [])) {
      const grams = toGrams(i.amount, i.unit, i.name);
      if (!grams) continue;
      const ingGco2 = (grams / 1000) * emissionIntensityKgCo2ePerKg(i.name) * 1000;
      const nm = (i.name || '').trim();
      if (nm) emitByIng[nm] = (emitByIng[nm] || 0) + ingGco2;
    }
  }

  const avgGco2 = sumGco2 / n;
  const co2Per1000Kcal = co2KcalN ? (sumCo2PerKcal / co2KcalN) * 1000 : 0;
  const topEmitIngs = Object.entries(emitByIng).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const topCo2Dishes = [...perDishCo2].sort((a, b) => b.g - a.g).slice(0, 6);
  const avgKcal = sumKcal / n;
  const avgP = sumP / n, avgF = sumF / n, avgC = sumC / n;
  const kMacro = 4 * avgP + 4 * avgC + 9 * avgF;
  const pctP = kMacro ? (4 * avgP / kMacro) * 100 : 0;
  const pctF = kMacro ? (9 * avgF / kMacro) * 100 : 0;
  const pctC = kMacro ? (4 * avgC / kMacro) * 100 : 0;

  const topIngs = Object.entries(ingCount).sort((a, b) => b[1] - a[1]).slice(0, 10);

  const allergenSorted = Object.entries(allergenRecipeCount)
    .sort((a, b) => b[1] - a[1])
    .map(([k, c]) => ({ key: k, label: allergenLabel(k, lang), count: c, pct: (c / n) * 100 }));

  const gaps = [];
  if (dietCounts.vegan === 0 && dietCounts.vegetarian === 0) {
    gaps.push(t('dash.gap_plant'));
  }
  if (dietCounts.gluten_free === 0 && n > 2) {
    gaps.push(t('dash.gap_gf'));
  }
  if (avgKcal > 720) gaps.push(t('dash.gap_high_kcal'));
  if (avgKcal > 0 && avgKcal < 220 && n > 2) gaps.push(t('dash.gap_low_kcal'));
  if (avgGco2 >= 2000) gaps.push(t('dash.gap_high_carbon'));
  for (const { key, pct } of allergenSorted) {
    if (pct >= 42) gaps.push(t('dash.gap_allergen_dense').replace('{a}', allergenLabel(key, lang)));
  }

  return {
    empty: false, n, foodN, drinkN, avgKcal, pctP, pctF, pctC,
    dietCounts, kcalBuckets, topIngs, allergenSorted, gaps,
    costFull, costPartial, costNone,
    avgGco2, co2Per1000Kcal, co2KcalN, topEmitIngs, topCo2Dishes,
  };
}

function dashCalcDetails(i18nBodyKey) {
  return `<details class="dash-calc">
    <summary class="dash-calc-summary">
      <span class="dash-calc-summary__ic">${cartaIcon('info', { size: 16, ariaHidden: true })}</span>
      <span data-i18n="dash.method_summary">How we calculate this</span>
    </summary>
    <div class="dash-calc-body"><p data-i18n="${i18nBodyKey}"></p></div>
  </details>`;
}

function dashCardHead(titleKey, methodBodyKey) {
  return `<div class="dash-card__head">
    <h2 data-i18n="${titleKey}">${escapeHTML(t(titleKey))}</h2>
    ${dashCalcDetails(methodBodyKey)}
  </div>`;
}

function renderDash(costMap) {
  const root = main.querySelector('#dashRoot');
  root.className = '';
  root.removeAttribute('aria-busy');
  const rows = scopedDishes();

  if (clusterFilter !== '__all__' && rows.length === 0 && allDishes.length > 0) {
    root.innerHTML = `<div class="dash-card dash-empty"><p data-i18n="dash.cluster_empty">${escapeHTML(t('dash.cluster_empty'))}</p></div>`;
    applyTranslations();
    applyRoleGates(role, main);
    return;
  }

  const st = analyze(rows, costMap);

  if (st.empty) {
    root.innerHTML = `
      <div class="dash-card dash-empty">
        <p class="lead" data-i18n="dash.empty">${escapeHTML(t('dash.empty'))}</p>
        <a class="btn btn-primary" href="/app/studio/recipes.html" data-i18n="dash.empty_cta">Open recipes</a>
      </div>`;
    applyTranslations();
    applyRoleGates(role, main);
    return;
  }

  root.innerHTML = `
    <div class="dash-grid" style="margin-bottom:var(--sp-5)">
      <article class="dash-card dash-card--viz" style="grid-column:1/-1">
        ${dashCardHead('dash.kpi_title', 'dash.method_kpi')}
        <div class="dash-kpis">
          <div class="dash-kpi"><div class="num">${st.n}</div><div class="lbl" data-i18n="dash.kpi_recipes">Recipes</div></div>
          <div class="dash-kpi"><div class="num">${formatNumber(st.avgKcal, 0)}</div><div class="lbl" data-i18n="dash.kpi_avg_kcal">Avg kcal / serving</div></div>
          <div class="dash-kpi"><div class="num">${st.foodN}</div><div class="lbl" data-i18n="dash.kpi_food">Food</div></div>
          <div class="dash-kpi"><div class="num">${st.drinkN}</div><div class="lbl" data-i18n="dash.kpi_drink">Drinks</div></div>
        </div>
      </article>
    </div>

    <div class="dash-grid">
      <article class="dash-card dash-gaps dash-card--viz ${st.gaps.length ? 'dash-card--warn' : ''}">
        ${dashCardHead('dash.gaps_title', 'dash.method_gaps')}
        ${st.gaps.length ? `<ul>${st.gaps.map(g => `<li>${escapeHTML(g)}</li>`).join('')}</ul>` : `<p class="text-muted" style="margin:0;font-size:var(--type-caption)" data-i18n="dash.gaps_none">No major gaps flagged for this set.</p>`}
      </article>
      <article class="dash-card dash-card--viz">
        ${dashCardHead('dash.health_title', 'dash.method_health')}
        <h3 data-i18n="dash.macro_split">Average energy from macros</h3>
        <div class="dash-macro-bar" aria-hidden="true">
          <span class="dash-macro-seg dash-macro-seg--p" style="width:${st.pctP}%;background:var(--chart-macro-protein)"></span>
          <span class="dash-macro-seg dash-macro-seg--c" style="width:${st.pctC}%;background:var(--chart-macro-carb)"></span>
          <span class="dash-macro-seg dash-macro-seg--f" style="width:${st.pctF}%;background:var(--chart-macro-fat)"></span>
        </div>
        <div class="dash-macro-legend">
          <span><i style="background:var(--chart-macro-protein)"></i><span data-i18n="recipes.protein">Protein</span> ${formatNumber(st.pctP, 0)}%</span>
          <span><i style="background:var(--chart-macro-carb)"></i><span data-i18n="recipes.carb">Carb</span> ${formatNumber(st.pctC, 0)}%</span>
          <span><i style="background:var(--chart-macro-fat)"></i><span data-i18n="recipes.fat">Fat</span> ${formatNumber(st.pctF, 0)}%</span>
        </div>
        <h3 style="margin-top:var(--sp-5)" data-i18n="dash.kcal_dist">Kcal per serving (buckets)</h3>
        ${['low','mid','high','vhigh'].map((k, i) => {
          const keys = ['dash.bucket_low','dash.bucket_mid','dash.bucket_high','dash.bucket_vhigh'];
          const lbl = t(keys[i]);
          const v = st.kcalBuckets[k];
          const pct = st.n ? (v / st.n) * 100 : 0;
          return `<div class="dash-row"><span style="min-width:100px;flex-shrink:0">${escapeHTML(lbl)}</span><div class="bar-wrap"><div class="dash-bar-fill" style="--bar-w:${pct}%;animation-delay:${0.04 + i * 0.07}s"></div></div><span class="pct">${v}</span></div>`;
        }).join('')}
      </article>

      <article class="dash-card dash-card--viz">
        ${dashCardHead('dash.inclusivity_title', 'dash.method_diet')}
        ${(['vegan','vegetarian','halal','gluten_free']).map((d, di) => {
          const v = st.dietCounts[d];
          const pct = st.n ? (v / st.n) * 100 : 0;
          const label = t('diet.' + d) || d;
          return `<div class="dash-row"><span style="min-width:120px;flex-shrink:0">${escapeHTML(label)}</span><div class="bar-wrap"><div class="dash-bar-fill" style="--bar-w:${pct}%;animation-delay:${0.05 + di * 0.06}s"></div></div><span class="pct">${v}/${st.n}</span></div>`;
        }).join('')}
      </article>

      <article class="dash-card dash-card--viz">
        ${dashCardHead('dash.allergen_title', 'dash.method_allergen')}
        <p class="text-muted" style="margin:0 0 var(--sp-3);font-size:var(--type-caption)" data-i18n="dash.allergen_sub">${escapeHTML(t('dash.allergen_sub'))}</p>
        ${st.allergenSorted.length ? st.allergenSorted.slice(0, 10).map((a, ai) => `
          <div class="dash-row">
            <span style="min-width:140px;flex-shrink:0">${escapeHTML(a.label)}</span>
            <div class="bar-wrap"><div class="dash-bar-fill" style="--bar-w:${Math.min(100, a.pct)}%;animation-delay:${0.04 + ai * 0.05}s"></div></div>
            <span class="pct">${formatNumber(a.pct, 0)}%</span>
          </div>
        `).join('') : `<p class="text-muted" data-i18n="dash.none">${escapeHTML(t('dash.none'))}</p>`}
      </article>

      <article class="dash-card dash-card--viz">
        ${dashCardHead('dash.ingredients_title', 'dash.method_ingredients')}
        ${st.topIngs.length ? `<ul style="margin:0;padding-left:1.1rem;font-size:var(--type-caption);line-height:1.65">${st.topIngs.map(([name, c]) => `<li><strong>${escapeHTML(name)}</strong> — ${c}×</li>`).join('')}</ul>` : `<p class="text-muted" data-i18n="dash.none">${escapeHTML(t('dash.none'))}</p>`}
      </article>

      <article class="dash-card dash-card--viz">
        ${dashCardHead('dash.cost_title', 'dash.method_cost')}
        <p class="text-muted" style="margin:0 0 var(--sp-3);font-size:var(--type-caption)" data-i18n="dash.cost_sub">${escapeHTML(t('dash.cost_sub'))}</p>
        <div class="dash-row"><span style="min-width:140px;flex-shrink:0" data-i18n="dash.cost_full">Fully costed</span><div class="bar-wrap"><div class="dash-bar-fill" style="--bar-w:${st.n ? (st.costFull / st.n) * 100 : 0}%;animation-delay:0.04s"></div></div><span class="pct">${st.costFull}</span></div>
        <div class="dash-row"><span style="min-width:140px;flex-shrink:0" data-i18n="dash.cost_partial">Partial</span><div class="bar-wrap"><div class="dash-bar-fill" style="--bar-w:${st.n ? (st.costPartial / st.n) * 100 : 0}%;animation-delay:0.11s"></div></div><span class="pct">${st.costPartial}</span></div>
        <div class="dash-row"><span style="min-width:140px;flex-shrink:0" data-i18n="dash.cost_missing">Missing prices</span><div class="bar-wrap"><div class="dash-bar-fill" style="--bar-w:${st.n ? (st.costNone / st.n) * 100 : 0}%;animation-delay:0.18s"></div></div><span class="pct">${st.costNone}</span></div>
        <div class="dash-links">
          <a class="btn btn-sm btn-outline" href="/app/studio/cost.html" data-i18n="dash.link_cost">Cost ledger</a>
          <a class="btn btn-sm btn-outline" href="/app/studio/pricing.html" data-i18n="dash.link_pricing">Pricing</a>
        </div>
      </article>

      <article class="dash-card dash-card--viz" style="grid-column:1/-1">
        ${dashCardHead('dash.carbon_title', 'dash.method_carbon')}
        <p class="text-muted" style="margin:0 0 var(--sp-3);font-size:var(--type-caption);line-height:1.5" data-i18n="dash.carbon_sub"></p>
        <div class="dash-kpis dash-kpis--co2" style="max-width:640px;margin-bottom:var(--sp-5)">
          <div class="dash-kpi"><div class="num">${formatNumber(st.avgGco2, 0)}</div><div class="lbl" data-i18n="dash.kpi_avg_co2">g CO₂e / serving</div></div>
          <div class="dash-kpi"><div class="num">${st.co2KcalN ? formatNumber(st.co2Per1000Kcal, 0) : '—'}</div><div class="lbl" data-i18n="dash.kpi_co2_kcal">g CO₂e / 1000 kcal</div></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--sp-5);align-items:start">
          <div>
            <h3 data-i18n="dash.carbon_top_dishes">Highest CO₂e per serving</h3>
            ${st.topCo2Dishes.length ? `<ul style="margin:0;padding-left:1.1rem;font-size:var(--type-caption);line-height:1.65">${st.topCo2Dishes.map(d => `<li><strong>${escapeHTML(d.name)}</strong> — ${formatNumber(d.g, 0)} g</li>`).join('')}</ul>` : `<p class="text-muted" data-i18n="dash.none">${escapeHTML(t('dash.none'))}</p>`}
          </div>
          <div>
            <h3 data-i18n="dash.carbon_top_ing">Top emission ingredients</h3>
            <p class="text-muted" style="margin:-4px 0 var(--sp-2);font-size:10px;letter-spacing:var(--track-caps);text-transform:uppercase" data-i18n="dash.carbon_ing_note">Cumulative g CO₂e, scoped recipes</p>
            ${st.topEmitIngs.length ? `<ul style="margin:0;padding-left:1.1rem;font-size:var(--type-caption);line-height:1.65">${st.topEmitIngs.map(([name, g]) => `<li><strong>${escapeHTML(name)}</strong> — ${formatNumber(g, 0)} g</li>`).join('')}</ul>` : `<p class="text-muted" data-i18n="dash.none">${escapeHTML(t('dash.none'))}</p>`}
          </div>
        </div>
      </article>

      <article class="dash-card dash-card--viz" style="grid-column:1/-1">
        <div class="dash-card__head" style="margin-bottom:var(--sp-3)">
          <h2 data-i18n="dash.next_title">${escapeHTML(t('dash.next_title'))}</h2>
        </div>
        <div class="dash-links">
          <a class="btn btn-sm btn-primary" href="/app/studio/matrix.html" data-i18n="dash.link_matrix">Menu engineering</a>
          <a class="btn btn-sm btn-outline" href="/app/studio/surface.html" data-i18n="dash.link_surface">Export</a>
          <a class="btn btn-sm btn-outline" href="/app/studio/variance.html" data-i18n="dash.link_variance">Variance</a>
        </div>
      </article>
    </div>
  `;
  applyTranslations();
  applyRoleGates(role, main);
  ensureDashVisible();
}

function escapeHTML(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function exportCsv(st) {
  const lines = [
    'metric,value',
    `recipes,${st.n}`,
    `avg_kcal_per_serving,${st.avgKcal.toFixed(1)}`,
    `food,${st.foodN}`,
    `drinks,${st.drinkN}`,
    `pct_protein_energy,${st.pctP.toFixed(1)}`,
    `pct_carb_energy,${st.pctC.toFixed(1)}`,
    `pct_fat_energy,${st.pctF.toFixed(1)}`,
    `diet_vegan,${st.dietCounts.vegan}`,
    `diet_vegetarian,${st.dietCounts.vegetarian}`,
    `diet_halal,${st.dietCounts.halal}`,
    `diet_gluten_free,${st.dietCounts.gluten_free}`,
    `cost_fully_mapped,${st.costFull}`,
    `cost_partial,${st.costPartial}`,
    `cost_missing,${st.costNone}`,
    `avg_g_co2e_per_serving,${st.avgGco2.toFixed(1)}`,
    `avg_g_co2e_per_1000kcal,${st.co2KcalN ? st.co2Per1000Kcal.toFixed(1) : ''}`,
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `carta-dashboard-${wsId.slice(0, 8)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

main.querySelector('#dashRefresh').addEventListener('click', () => { void load(); });
main.querySelector('#dashCsv').addEventListener('click', async () => {
  const { data: costs } = await supabase.from('cost_db').select('*').eq('workspace_id', wsId);
  const costMap = buildCostMap(costs || []);
  const st = analyze(scopedDishes(), costMap);
  if (!st.empty) exportCsv(st);
});
main.querySelector('#dashPrint').addEventListener('click', () => window.print());

window.addEventListener('beforeprint', () => {
  main.querySelectorAll('.dash-calc').forEach(d => d.setAttribute('open', ''));
});
window.addEventListener('afterprint', () => {
  main.querySelectorAll('.dash-calc').forEach(d => d.removeAttribute('open'));
});

window.addEventListener('carta-lang-change', () => {
  setTimeout(() => {
    fillClusterSelect();
    renderDash(lastCostMap);
    applyRoleGates(role, main);
  }, 0);
});

await load();
}
</script>
</body>
</html>
