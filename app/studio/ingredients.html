<style>
  .studio-page {
    padding: var(--sp-7) var(--margin-desktop) var(--sp-10);
    flex: 1; overflow-y: auto;
  }
  @media (max-width: 900px) {
    .studio-page { padding: var(--sp-5) var(--margin-mobile) var(--sp-8); }
  }

  .page-head {
    max-width: 1200px; margin: 0 auto var(--sp-6);
    display: grid; grid-template-columns: 1fr auto;
    gap: var(--sp-5); align-items: end;
  }
  @media (max-width: 760px) { .page-head { grid-template-columns: 1fr; } }
  .page-head__title .eyebrow { margin-bottom: var(--sp-3); }
  .page-head__title h1 { margin: 0 0 var(--sp-3); }
  .page-head__title .lead { margin: 0; max-width: 56ch; }
  .page-head__actions {
    display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center;
    justify-content: flex-end;
  }

  .toolbar {
    max-width: 1200px; margin: 0 auto var(--sp-5);
    display: flex; flex-direction: column; gap: var(--sp-4);
  }
  .chip-rail {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .chip-rail__label {
    font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant); margin-right: 4px;
  }
  .filter-chip {
    border: 1px solid var(--outline-variant);
    background: var(--surface-container-lowest);
    border-radius: var(--r-pill);
    padding: 8px 14px;
    font-family: var(--font-sans); font-size: 11px;
    font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant);
    cursor: pointer;
    transition: background var(--dur-2), color var(--dur-2), border-color var(--dur-2);
  }
  .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
  .filter-chip[aria-pressed="true"] {
    background: var(--primary); color: var(--on-primary); border-color: var(--primary);
  }
  .filter-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .search-row {
    display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-pill);
    padding: 6px 6px 6px 18px;
  }
  .search-row input {
    flex: 1; min-width: 200px;
    background: transparent; border: 0;
    font-family: var(--font-sans); font-size: var(--type-body);
    padding: 10px 8px; outline: none;
  }

  .ledger-wrap { max-width: 1200px; margin: 0 auto var(--sp-8); }
  .ledger {
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
    overflow: auto;
    max-height: min(70vh, 720px);
  }
  .ledger table { width: 100%; border-collapse: collapse; min-width: 800px; }
  .ledger th {
    position: sticky; top: 0;
    z-index: 1;
    text-align: left;
    font-size: var(--type-label-sm); letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant);
    padding: 14px var(--sp-4);
    background: var(--surface-container-low);
    border-bottom: 1px solid var(--outline-variant);
  }
  .ledger td {
    padding: 12px var(--sp-4);
    border-bottom: 1px solid var(--outline-variant);
    font-size: var(--type-body);
    vertical-align: middle;
  }
  .ledger tbody tr:hover { background: var(--surface-container); }
  .col-key { font-family: var(--font-display); font-style: italic; color: var(--primary); }
  .col-num { font-variant-numeric: tabular-nums; text-align: right; }

  .custom-panel {
    max-width: 1200px; margin: 0 auto;
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-inner-glow), var(--shadow-2);
    padding: var(--sp-6);
  }
  .custom-panel h2 { margin: 0 0 var(--sp-4); font-family: var(--font-display); font-style: italic; font-weight: 400; color: var(--primary); }
  .custom-form {
    display: grid;
    grid-template-columns: 1.5fr repeat(5, minmax(72px, 1fr)) 1.2fr auto;
    gap: var(--sp-3); align-items: end;
    margin-bottom: var(--sp-5);
  }
  @media (max-width: 900px) {
    .custom-form { grid-template-columns: 1fr 1fr; }
  }
  .custom-form .form-cell label {
    display: block; font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase;
    color: var(--on-surface-variant); margin-bottom: 6px;
  }
  .mini-table-wrap { overflow: auto; max-height: 240px; border: 1px solid var(--outline-variant); border-radius: var(--r-lg); }
  .mini-table-wrap table { width: 100%; border-collapse: collapse; }
  .mini-table-wrap th, .mini-table-wrap td { padding: 8px 12px; border-bottom: 1px solid var(--outline-variant); text-align: left; font-size: var(--type-caption); }
  .mini-table-wrap th { background: rgb(var(--ink-rgb) / 0.05); }
  @media (max-width: 700px) { .hide-narrow { display: none; } }
  .map-panel, .custom-panel {
    max-width: 1200px; margin: 0 auto var(--sp-8);
    background: var(--surface-container-lowest);
    border: var(--glass-border);
    border-radius: var(--r-2xl);
    padding: var(--glass-padding);
    box-shadow: var(--shadow-2);
  }
  .map-panel h2, .custom-panel h2 {
    margin: 0 0 var(--sp-3);
    font-family: var(--font-display); font-style: italic; font-weight: 400;
    color: var(--primary);
  }
  .sap-form {
    display: grid; grid-template-columns: 1.4fr 1.4fr 0.8fr auto;
    gap: var(--sp-3); align-items: end; margin-bottom: var(--sp-5);
  }
  @media (max-width: 900px) { .sap-form { grid-template-columns: 1fr 1fr; } }
  .sap-form .form-cell label {
    display: block; font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps);
    text-transform: uppercase; color: var(--on-surface-variant); margin-bottom: 6px;
  }
  .ledger tbody tr.ing-row-click { cursor: pointer; }
  .ledger tbody tr.ing-row-click:hover td { background: rgb(var(--sage-deep-rgb) / 0.08); }
  .allergen-modal .check-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px; margin: var(--sp-4) 0;
  }
  .allergen-modal label.chk {
    display: flex; align-items: center; gap: 8px; font-size: var(--type-caption);
    cursor: pointer;
  }
  .allergen-modal .modal-sub {
    margin: var(--sp-5) 0 var(--sp-3);
    font-size: var(--type-label-sm);
    letter-spacing: var(--track-caps);
    text-transform: uppercase;
    color: var(--on-surface-variant);
  }
  .allergen-modal .modal-intro,
  .allergen-modal .modal-hint { font-size: var(--type-caption); margin: 0 0 var(--sp-4); }
  .allergen-modal .modal__foot.split { justify-content: space-between; }
  .brand-add-form, .brand-macro-form {
    display: grid;
    grid-template-columns: 1.2fr repeat(3, minmax(64px, 1fr)) auto;
    gap: var(--sp-3); align-items: end; margin: var(--sp-4) 0;
  }
  @media (max-width: 640px) {
    .brand-add-form, .brand-macro-form { grid-template-columns: 1fr 1fr; }
  }
  .brand-add-form .form-cell label,
  .brand-macro-form .form-cell label {
    display: block; font-size: 10px; font-weight: 600; letter-spacing: var(--track-caps);
    text-transform: uppercase; color: var(--on-surface-variant); margin-bottom: 6px;
  }
  .btn-row-inline { display: flex; gap: 4px; flex-wrap: wrap; }
  .brand-edit-title { margin: var(--sp-4) 0 var(--sp-2); font-family: var(--font-display); font-style: italic; color: var(--primary); }
  .col-brands { text-align: center; font-variant-numeric: tabular-nums; }
  .sap-form { grid-template-columns: 1.2fr 1.2fr 0.9fr 0.9fr auto; }
</style>
</head>
<body>
<a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>

<script type="module">
import { mountStudioShell } from '/src/studio-layout.js';
import {
  NUTRIENT_DB, ALLERGEN_LABELS, ingredientLabel, ingredientSearchBlob,
  nutrientCategoryId, ING_CATEGORY_ORDER, turkNorm,
} from '/src/nutrient-db.js';
import { atwaterKcal, formatNumber } from '/src/recipe-compute.js';
import { applyTranslations, t, getLang } from '/src/i18n.js';
import { downloadWorkbook } from '/src/xlsx-export.js';
import { cartaIcon } from '/src/carta-icon.js';
import { applyRoleGates } from '/src/permissions.js';
import { supabase } from '/src/supabase-client.js';
import {
  loadIngredientRegistry,
  upsertIngredientAlias,
  parseAllergenList,
} from '/src/ingredient-registry.js';
import { openIngredientDetailModal } from '/src/ingredient-brand-modal.js';

const main = document.createElement('main');
main.id = 'main';
main.className = 'studio-page';

const ctx = await mountStudioShell({ active: 'ingredients', main });
if (!ctx) {
  // mountStudioShell already redirected
} else {
const wsId = ctx.workspace.id;
const { role } = ctx;
const LS_KEY = `carta_ing_custom_${wsId}`;

function escapeHTML(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function rowKcal(r) {
  return atwaterKcal({
    P: Number(r.P) || 0,
    F: Number(r.F) || 0,
    C: Number(r.C) || 0,
    Fi: Number(r.Fi) || 0,
    ethanol: Number(r.ethanol) || 0,
  });
}

function allergenList(row, cl) {
  const a = Array.isArray(row.allergens) ? row.allergens : [];
  return a.map(x => ALLERGEN_LABELS[x]?.[cl] || x).join(', ');
}

function allergensForKey(key, row, cl) {
  if (ingredientRegistry) {
    const resolved = ingredientRegistry.resolve(key);
    if (resolved?.allergens) {
      return resolved.allergens.map((x) => ALLERGEN_LABELS[x]?.[cl] || x).join(', ');
    }
  }
  return allergenList(row, cl);
}

function hasAllergenOverride(key) {
  return ingredientRegistry?.hasDefaultAllergenOverride?.(key);
}

async function reloadRegistry() {
  const { registry, tableMissing } = await loadIngredientRegistry(supabase, wsId, { localCustom: customRows });
  ingredientRegistry = registry;
  if (tableMissing) console.warn('workspace_ingredient_aliases / custom_ingredients not deployed');
  const { data } = await supabase
    .from('workspace_ingredient_aliases')
    .select('alias,maps_to,sap_code,brand_name')
    .eq('workspace_id', wsId)
    .order('alias', { ascending: true });
  sapAliases = data || [];
}

function renderSapAliases() {
  const tbody = main.querySelector('#sapAliasTbody');
  if (!tbody) return;
  if (!sapAliases.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-muted" data-i18n="ingdb.sap_empty">No SAP mappings yet.</td></tr>`;
    applyTranslations();
    return;
  }
  tbody.innerHTML = sapAliases.map((row) => `
    <tr>
      <td>${escapeHTML(row.alias)}</td>
      <td class="col-key">${escapeHTML(row.maps_to)}</td>
      <td>${escapeHTML(row.brand_name || '—')}</td>
      <td>${escapeHTML(row.sap_code || '—')}</td>
      <td><button type="button" class="btn btn-sm btn-ghost sap-rm" data-alias="${escapeHTML(row.alias)}" data-require="cost_delete">×</button></td>
    </tr>`).join('');
  tbody.querySelectorAll('.sap-rm').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm(t('ingdb.sap_remove_confirm'))) return;
      const alias = btn.getAttribute('data-alias');
      const { error } = await supabase.from('workspace_ingredient_aliases').delete().eq('workspace_id', wsId).eq('alias', alias);
      if (error) { alert(error.message); return; }
      await reloadRegistry();
      renderSapAliases();
      render();
    });
  });
  applyRoleGates(role, tbody);
}

function openIngredientModal(canonicalKey, baseRow) {
  openIngredientDetailModal({
    supabase, wsId, t, getLang, escapeHTML, cartaIcon, formatNumber, rowKcal,
    ingredientRegistry, applyTranslations,
  }, canonicalKey, baseRow, async () => {
    await reloadRegistry();
    render();
  });
}

const referenceRows = Object.keys(NUTRIENT_DB).map(key => {
  const row = NUTRIENT_DB[key];
  return {
    source: 'reference',
    key,
    row,
    category: nutrientCategoryId(key, row),
    kcal: rowKcal(row),
    nameTr: ingredientLabel(key, 'tr'),
    nameEn: ingredientLabel(key, 'en'),
    nameEs: ingredientLabel(key, 'es'),
    searchBlob: ingredientSearchBlob(key),
  };
});

let customRows = [];
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) customRows = JSON.parse(raw);
  if (!Array.isArray(customRows)) customRows = [];
} catch { customRows = []; }

function persistCustom() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(customRows)); } catch (e) { console.warn(e); }
}

let filterCat = 'all';
let beverageFilter = 'all';
let searchQ = '';
/** @type {import('/src/ingredient-registry.js').createIngredientRegistry extends Function ? ReturnType<import('/src/ingredient-registry.js').createIngredientRegistry> : any} */
let ingredientRegistry = null;
let sapAliases = [];
const canonicalOptions = Object.keys(NUTRIENT_DB).sort((a, b) => a.localeCompare(b, 'tr'));

main.innerHTML = `
  <div class="page-head">
    <div class="page-head__title">
      <span class="eyebrow eyebrow-accent" data-i18n="ingdb.eyebrow">Reference data</span>
      <h1 class="h1"><span data-i18n="ingdb.title">Ingredient</span> <em data-i18n="ingdb.title_em">database</em></h1>
      <p class="lead" data-i18n="ingdb.intro">Codex Ek-10 style values per 100 g. Filter, audit export, add workspace-only custom rows.</p>
    </div>
    <div class="page-head__actions">
      <button type="button" class="btn btn-primary btn-sm" id="exportAuditBtn" data-require="export">
        ${cartaIcon('download', { size: 18 })}
        <span data-i18n="ingdb.export_audit">Audit Excel</span>
      </button>
    </div>
  </div>

  <div class="studio-panel-visual">
    <figure class="studio-panel-visual__cell" style="--ar-w:824; --ar-h:1024;"><img class="is-brand-visual" src="/assets/carta-editorial-marble.png" alt="Brass-accented marble surface with stationery, suggesting a cost ledger desk." data-i18n-alt="img.alt.marble_ledger" width="824" height="1024" loading="lazy" decoding="async"></figure>
  </div>

  <div class="toolbar">
    <div class="search-row">
      ${cartaIcon('search', { size: 20, style: 'color:var(--outline)' })}
      <label class="visually-hidden" for="ingSearch" data-i18n="ingdb.search_ph">Search…</label>
      <input id="ingSearch" type="search" autocomplete="off" data-i18n-ph="ingdb.search_ph">
    </div>
    <div class="chip-rail" id="beverageRail">
      <span class="chip-rail__label" data-i18n="ingdb.bev_label">Beverages</span>
      <button type="button" class="filter-chip" data-bev="all" aria-pressed="true" data-i18n="ingdb.bev_all">All</button>
      <button type="button" class="filter-chip" data-bev="food" aria-pressed="false" data-i18n="ingdb.bev_food">Food</button>
      <button type="button" class="filter-chip" data-bev="drinks" aria-pressed="false" data-i18n="ingdb.bev_drinks">Drinks</button>
    </div>
    <div class="chip-rail" id="categoryRail"></div>
  </div>

  <div class="ledger-wrap">
    <div class="ledger">
      <table>
        <thead>
          <tr>
            <th data-i18n="ingdb.col_key_tr">Name (TR)</th>
            <th class="hide-narrow" data-i18n="ingdb.col_name_en">Name (EN)</th>
            <th class="hide-narrow" data-i18n="ingdb.col_name_es">Name (ES)</th>
            <th data-i18n="ingdb.col_category">Category</th>
            <th class="col-num hide-narrow" data-i18n="ingdb.col_kcal">kcal / 100g</th>
            <th class="col-num hide-narrow">P</th>
            <th class="col-num hide-narrow">F</th>
            <th class="col-num hide-narrow">C</th>
            <th class="hide-narrow col-brands" data-i18n="ingdb.col_brands">Brands</th>
            <th class="hide-narrow" data-i18n="ingdb.col_allergens">Allergens</th>
          </tr>
        </thead>
        <tbody id="ingTbody"></tbody>
      </table>
    </div>
  </div>

  <section class="map-panel" id="sapMapPanel">
    <h2 data-i18n="ingdb.sap_section">SAP name mapping</h2>
    <p class="text-muted" style="margin:0 0 var(--sp-5);font-size:var(--type-caption);max-width:70ch" data-i18n="ingdb.sap_intro">Map SAP labels to Carta keys.</p>
    <form class="sap-form" id="sapMapForm">
      <div class="form-cell">
        <label for="sapAlias" data-i18n="ingdb.sap_alias">SAP label</label>
        <input class="input" id="sapAlias" type="text" required autocomplete="off" data-require-disable="cost_create">
      </div>
      <div class="form-cell">
        <label for="sapMapsTo" data-i18n="ingdb.sap_maps_to">Carta ingredient</label>
        <input class="input" id="sapMapsTo" type="text" required list="canonicalList" autocomplete="off" data-require-disable="cost_create">
      </div>
      <div class="form-cell">
        <label for="sapBrand" data-i18n="ingdb.sap_brand">Sub-brand</label>
        <input class="input" id="sapBrand" type="text" autocomplete="off" data-require-disable="cost_create" placeholder="">
      </div>
      <div class="form-cell">
        <label for="sapCode" data-i18n="ingdb.sap_code">SAP code</label>
        <input class="input" id="sapCode" type="text" autocomplete="off" data-require-disable="cost_create">
      </div>
      <div class="form-cell">
        <button type="submit" class="btn btn-primary" data-i18n="ingdb.sap_add" data-require="cost_create">Save mapping</button>
      </div>
    </form>
    <datalist id="canonicalList">${canonicalOptions.map(k => `<option value="${escapeHTML(k)}">`).join('')}</datalist>
    <div class="mini-table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="ingdb.sap_alias">SAP label</th>
            <th data-i18n="ingdb.sap_maps_to">Carta ingredient</th>
            <th data-i18n="ingdb.sap_brand">Sub-brand</th>
            <th data-i18n="ingdb.sap_code">SAP code</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sapAliasTbody"></tbody>
      </table>
    </div>
  </section>

  <div class="custom-panel">
    <h2 data-i18n="ingdb.custom_title">Custom rows (this workspace)</h2>
    <p class="text-muted" style="margin:-8px 0 var(--sp-5);font-size:var(--type-caption);max-width:62ch" data-i18n="ingdb.custom_intro">Stored in this browser for audits and costing notes. Not synced to Codex reference.</p>
    <form class="custom-form" id="customForm">
      <div class="form-cell" style="grid-column:span 2">
        <label for="cName" data-i18n="ingdb.custom_name">Name</label>
        <input class="input" id="cName" type="text" required>
      </div>
      <div class="form-cell"><label for="cP">P</label><input class="input" id="cP" type="number" step="0.1" value="0"></div>
      <div class="form-cell"><label for="cF">F</label><input class="input" id="cF" type="number" step="0.1" value="0"></div>
      <div class="form-cell"><label for="cC">C</label><input class="input" id="cC" type="number" step="0.1" value="0"></div>
      <div class="form-cell"><label for="cFi">Fi</label><input class="input" id="cFi" type="number" step="0.1" value="0"></div>
      <div class="form-cell"><label for="cE">EtOH</label><input class="input" id="cE" type="number" step="0.1" value="0"></div>
      <div class="form-cell" style="min-width:140px">
        <label for="cA" data-i18n="ingdb.custom_allergens">Allergens</label>
        <input class="input" id="cA" type="text" placeholder="gluten, milk">
      </div>
      <div class="form-cell">
        <button type="submit" class="btn btn-primary" data-i18n="ingdb.custom_add">Add</button>
      </div>
    </form>
    <div class="mini-table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="ingdb.col_key_tr">Name</th>
            <th class="col-num" data-i18n="ingdb.col_kcal">kcal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="customTbody"></tbody>
      </table>
    </div>
  </div>
`;

const vh = document.createElement('style');
vh.textContent = '.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}';
document.head.appendChild(vh);

applyTranslations();
const searchEl = main.querySelector('#ingSearch');
searchEl.placeholder = t('ingdb.search_ph');
main.querySelectorAll('#customForm input, #customForm button[type="submit"]').forEach(el => {
  el.setAttribute('data-require-disable', 'cost_create');
});
applyRoleGates(role, main);

function catLabel(id) {
  return t(`ingdb.cat.${id}`) || id;
}

function rebuildCategoryChips() {
  const rail = main.querySelector('#categoryRail');
  const parts = [
    `<span class="chip-rail__label" data-i18n="ingdb.cat_label">Category</span>`,
    `<button type="button" class="filter-chip" data-cat="all" aria-pressed="${filterCat === 'all'}" data-i18n="ingdb.cat_all">All</button>`,
    ...ING_CATEGORY_ORDER.map(cid =>
      `<button type="button" class="filter-chip" data-cat="${escapeHTML(cid)}" aria-pressed="${filterCat === cid}" data-i18n="ingdb.cat.${cid}">${escapeHTML(catLabel(cid))}</button>`
    ),
  ];
  rail.innerHTML = parts.join('');
  applyTranslations();
  rail.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      filterCat = btn.getAttribute('data-cat');
      rail.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      render();
    });
  });
}

function setBeverageMode(mode) {
  beverageFilter = mode;
  const rail = main.querySelector('#beverageRail');
  rail.querySelectorAll('[data-bev]').forEach(b => {
    const on = b.getAttribute('data-bev') === mode;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  render();
}

main.querySelector('#beverageRail').querySelectorAll('[data-bev]').forEach(btn => {
  btn.addEventListener('click', () => setBeverageMode(btn.getAttribute('data-bev')));
});

searchEl.addEventListener('input', () => {
  searchQ = searchEl.value.trim().toLowerCase();
  render();
});

function passesRefFilters(entry) {
  if (beverageFilter === 'food' && entry.category === 'beverages') return false;
  if (beverageFilter === 'drinks' && entry.category !== 'beverages') return false;
  if (filterCat !== 'all' && entry.category !== filterCat) return false;
  if (searchQ) {
    const blob = (entry.searchBlob || entry.key).toLowerCase();
    if (!blob.includes(searchQ)) return false;
  }
  return true;
}

function render() {
  const cl = getLang();
  const tbody = main.querySelector('#ingTbody');
  const filtered = referenceRows.filter(passesRefFilters);
  tbody.innerHTML = filtered.map(entry => {
    const { key, row, category, kcal, nameTr, nameEn, nameEs } = entry;
    const al = allergensForKey(key, row, cl) || '—';
    const bc = ingredientRegistry?.brandCount?.(key) || 0;
    const brandChip = bc
      ? `<span class="chip chip-gold" title="${escapeHTML(t('ingdb.brand_section'))}">${bc}</span>`
      : '—';
    const ov = hasAllergenOverride(key)
      ? ` <span class="chip chip-gold" style="font-size:10px" data-i18n="ingdb.allergen_override">Custom</span>`
      : '';
    return `<tr class="ing-row-click" data-ing-key="${escapeHTML(key)}" title="${escapeHTML(t('ingdb.brand_edit_row'))}">
      <td class="col-key">${escapeHTML(nameTr)}</td>
      <td class="hide-narrow">${escapeHTML(nameEn)}</td>
      <td class="hide-narrow">${escapeHTML(nameEs)}</td>
      <td><span class="chip">${escapeHTML(catLabel(category))}</span></td>
      <td class="col-num hide-narrow">${formatNumber(kcal, 0)}</td>
      <td class="col-num hide-narrow">${formatNumber(row.P, 1)}</td>
      <td class="col-num hide-narrow">${formatNumber(row.F, 1)}</td>
      <td class="col-num hide-narrow">${formatNumber(row.C, 1)}</td>
      <td class="hide-narrow col-brands">${brandChip}</td>
      <td class="hide-narrow">${escapeHTML(al)}${ov}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('.ing-row-click').forEach((tr) => {
    tr.addEventListener('click', () => {
      const key = tr.getAttribute('data-ing-key');
      const entry = referenceRows.find((e) => e.key === key);
      if (entry) openIngredientModal(key, entry.row);
    });
  });

  const cbody = main.querySelector('#customTbody');
  cbody.innerHTML = customRows.length ? customRows.map((r, i) => {
    const kk = rowKcal(r);
    return `<tr>
      <td>${escapeHTML(r.name)}</td>
      <td class="col-num">${formatNumber(kk, 0)}</td>
      <td><button type="button" class="btn btn-sm btn-ghost" data-rm="${i}" data-require="cost_delete" data-i18n="ingdb.custom_remove">Remove</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="3" class="text-muted" data-i18n="ingdb.custom_empty">No custom rows yet.</td></tr>`;
  applyTranslations();
  cbody.querySelectorAll('[data-rm]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.getAttribute('data-rm'));
      customRows.splice(i, 1);
      persistCustom();
      render();
    });
  });
  applyRoleGates(role, main);
}

main.querySelector('#customForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = main.querySelector('#cName').value.trim();
  if (!name) return;
  const parseN = id => Number(main.querySelector(id).value) || 0;
  const allergens = parseAllergenList(main.querySelector('#cA').value);
  customRows.push({
    name,
    P: parseN('#cP'),
    F: parseN('#cF'),
    C: parseN('#cC'),
    Fi: parseN('#cFi'),
    ethanol: parseN('#cE'),
    allergens,
  });
  persistCustom();
  main.querySelector('#customForm').reset();
  main.querySelector('#cP').value = '0';
  main.querySelector('#cF').value = '0';
  main.querySelector('#cC').value = '0';
  main.querySelector('#cFi').value = '0';
  main.querySelector('#cE').value = '0';
  render();
});

main.querySelector('#exportAuditBtn').addEventListener('click', () => {
  const cl = getLang();
  const hSource = t('ingdb.col_source');
  const hKey = t('ingdb.col_key_tr');
  const hEn = t('ingdb.col_name_en');
  const hEs = t('ingdb.col_name_es');
  const hCat = t('ingdb.col_category');
  const hKcal = t('ingdb.col_kcal');
  const hAllerg = t('ingdb.col_allergens');
  const headers = [hSource, hKey, hEn, hEs, hCat, 'P', 'F', 'C', 'Fi', 'ethanol', hKcal, hAllerg];

  const refSheet = [headers];
  for (const entry of referenceRows) {
    const { key, row, category, kcal, nameTr, nameEn, nameEs } = entry;
    refSheet.push([
      'reference',
      { v: nameTr, t: 'String' },
      { v: nameEn, t: 'String' },
      { v: nameEs, t: 'String' },
      { v: catLabel(category), t: 'String' },
      { v: Number(row.P) || 0, t: 'Number' },
      { v: Number(row.F) || 0, t: 'Number' },
      { v: Number(row.C) || 0, t: 'Number' },
      { v: Number(row.Fi) || 0, t: 'Number' },
      { v: Number(row.ethanol) || 0, t: 'Number' },
      { v: kcal, t: 'Number' },
      { v: allergenList(row, cl), t: 'String' },
    ]);
  }

  const customSheet = [headers];
  for (const row of customRows) {
    const cat = 'custom';
    customSheet.push([
      'custom',
      { v: row.name, t: 'String' },
      { v: '', t: 'String' },
      { v: cat, t: 'String' },
      { v: Number(row.P) || 0, t: 'Number' },
      { v: Number(row.F) || 0, t: 'Number' },
      { v: Number(row.C) || 0, t: 'Number' },
      { v: Number(row.Fi) || 0, t: 'Number' },
      { v: Number(row.ethanol) || 0, t: 'Number' },
      { v: rowKcal(row), t: 'Number' },
      { v: (row.allergens || []).join(', '), t: 'String' },
    ]);
  }

  downloadWorkbook(`carta-ingredient-audit-${wsId.slice(0, 8)}.xls`, [
    { name: 'Reference', rows: refSheet },
    { name: 'Custom', rows: customSheet },
  ]);
});

main.querySelector('#sapMapForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const alias = main.querySelector('#sapAlias').value.trim();
  const mapsTo = main.querySelector('#sapMapsTo').value.trim();
  const sapCode = main.querySelector('#sapCode').value.trim() || null;
  const brandName = main.querySelector('#sapBrand')?.value.trim() || null;
  if (!alias || !mapsTo) return;
  const { error } = await upsertIngredientAlias(supabase, wsId, {
    alias, maps_to: mapsTo, sap_code: sapCode, brand_name: brandName,
  });
  if (error) { alert(error.message); return; }
  main.querySelector('#sapMapForm').reset();
  await reloadRegistry();
  renderSapAliases();
  render();
});

await reloadRegistry();
rebuildCategoryChips();
setBeverageMode('all');
renderSapAliases();
render();

window.addEventListener('carta-lang-change', () => {
  setTimeout(() => {
    searchEl.placeholder = t('ingdb.search_ph');
    rebuildCategoryChips();
    setBeverageMode(beverageFilter);
    render();
  }, 0);
});
}
</script>
</body>
</html>
