<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B2A22">
<title>Carta · Logo dosyaları (iç)</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    background: #f4f2ec;
    color: #1b2a22;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121a16; color: #edeae4; }
    .card { background: #1d2b23; border-color: rgba(255,255,255,0.1); }
    .url code { background: #121a16; color: #e8e4dc; }
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
  .note { opacity: 0.85; margin: 0 0 24px; max-width: 70ch; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid rgba(27, 42, 34, 0.12);
    border-radius: 12px;
    padding: 14px;
  }
  .thumb {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100px;
    margin-bottom: 10px;
    background: rgba(27, 42, 34, 0.04);
    border-radius: 8px;
  }
  .thumb img {
    max-width: 100%;
    max-height: 88px;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  .thumb img.svg-thumb { max-height: 48px; }
  .label { font-weight: 600; font-size: 12px; margin-bottom: 8px; letter-spacing: 0.02em; }
  .url { margin: 0; font-size: 11px; word-break: break-all; }
  .url code {
    display: block;
    padding: 8px 10px;
    background: #fbfaf6;
    border-radius: 6px;
    font-family: ui-monospace, monospace;
    border: 1px solid rgba(27, 42, 34, 0.12);
  }
</style>
</head>
<body>
<main>
  <h1>Carta · Logo ve kimlik görselleri</h1>
  <p class="note">
    Menüde yok; <code>noindex</code>. Aşağıda her satırda <strong>önizleme</strong> ve imza / e-posta için <strong>tam HTTPS adresi</strong> var (üretim kökü: <code>https://cart-a.live</code>).
    Yerelde açıyorsan önizleme görselleri yine bu dosyanın kökünden yüklenir; imzada mutlaka üretim URL’sini kullan.
  </p>
  <div class="grid">

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-lockup-horizontal.png?v=8" alt="Yatay lockup" width="1024" height="1024" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Yatay lockup (birincil · F&amp;B)</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-lockup-horizontal.png?v=8</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-vertical.png?v=7" alt="Dikey wordmark" width="1536" height="1024" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Dikey wordmark (eski · FEB yazım hatası, kullanma)</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-vertical.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-seal.png?v=7" alt="Mühür" width="1536" height="1024" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Mühür · monogram</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-seal.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-vertical-logo.png?v=7" alt="Dikey logo" width="1024" height="1024" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Dikey logo (alternatif dosya)</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-vertical-logo.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-logo.png" alt="Kare logo" width="512" height="512" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Eski kare logo</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-logo.png</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-logo-wordmark.png" alt="Wordmark" width="1024" height="256" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Kelime işareti</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-logo-wordmark.png</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-card.png?v=7" alt="Kart marka" width="1024" height="1024" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Kart çerçeveli marka</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-card.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-stickers.png?v=7" alt="Rozetler" width="1024" height="764" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Uyumluluk rozetleri</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-stickers.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-palette.png?v=7" alt="Palet" width="1024" height="764" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Renk paleti şeması</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-palette.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-guidelines-board.png?v=7" alt="Kimlik panosu" width="1024" height="1024" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Kimlik panosu</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-guidelines-board.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-brand-header-reference.png?v=7" alt="Header referans" width="1536" height="1024" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Üst şerit referans</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-brand-header-reference.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-favicon.png?v=7" alt="Favikons" width="64" height="64" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Favicon</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-favicon.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img src="/assets/carta-apple-touch-icon.png?v=7" alt="Apple touch" width="180" height="180" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">Apple touch</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-apple-touch-icon.png?v=7</code></p>
    </figure>

    <figure class="card">
      <div class="thumb">
        <img class="svg-thumb" src="/assets/carta-icons.svg" alt="İkonlar SVG" width="24" height="24" loading="lazy" decoding="async">
      </div>
      <figcaption class="label">İkon sprite (SVG)</figcaption>
      <p class="url"><code>https://cart-a.live/assets/carta-icons.svg</code></p>
    </figure>

  </div>
</main>
</body>
</html>
